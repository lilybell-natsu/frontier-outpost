<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3a2a">
<meta name="app-version" content="0.3.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開拓記">
<title>フロンティア開拓記</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg-1:#1c2a1c;
    --bg-2:#2b3a2a;
    --panel:#33291f;
    --panel-2:#3d3122;
    --card:#4a3b28;
    --card-border:#6b5638;
    --parchment:#e9dcbb;
    --parchment-dim:#c9bb94;
    --wood:#c98a4b;
    --food:#e0725a;
    --gold:#f0c245;
    --green:#7cb662;
    --green-dark:#4c8a3a;
    --danger:#d1594a;
    --shadow: 0 4px 10px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:
      radial-gradient(circle at 50% -10%, #35492f 0%, var(--bg-1) 55%, #131d13 100%);
    color:var(--parchment);
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Header / resource bar ---------- */
  header{
    position:sticky; top:0; z-index:10;
    padding:10px 10px 8px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(180deg, #24331f 0%, #1c2a1c 100%);
    border-bottom:1px solid #0d150d;
    box-shadow:var(--shadow);
  }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .titlebar h1{
    font-size:15px; margin:0; letter-spacing:.05em; color:var(--parchment);
    display:flex; align-items:center; gap:6px;
  }
  .gear-btn{
    background:none; border:none; color:var(--parchment-dim);
    font-size:18px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  .res-bar{
    display:flex; gap:6px;
  }
  .res-chip{
    flex:1;
    background:var(--panel);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:5px 6px;
    display:flex; align-items:center; gap:5px;
    min-width:0;
  }
  .res-chip .ic{font-size:16px;}
  .res-chip .num{
    font-size:12.5px; font-weight:600; color:var(--parchment);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .res-chip .num small{color:var(--parchment-dim); font-weight:400;}
  .res-chip.gold .num{color:var(--gold);}
  .res-fill{
    height:3px; border-radius:2px; margin-top:3px; background:#00000055; overflow:hidden;
  }
  .res-fill i{display:block; height:100%; background:var(--green); transition:width .3s;}
  .res-chip.food .res-fill i{background:var(--food);}
  .res-chip.wood .res-fill i{background:var(--wood);}

  /* ---------- Main / views ---------- */
  main{flex:1; padding:12px 10px 90px; overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .section-title{
    font-size:12.5px; color:var(--parchment-dim); margin:14px 2px 8px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .section-title:first-child{margin-top:0;}

  /* building cards */
  .bcard{
    background:linear-gradient(180deg, var(--card) 0%, #40331f 100%);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .bcard.locked{opacity:.55;}
  .bcard-top{display:flex; align-items:center; gap:10px;}
  .bcard-icon{
    width:44px; height:44px; border-radius:10px;
    background:#2a2115; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0; border:1px solid #1a140c;
  }
  .bcard-info{flex:1; min-width:0;}
  .bcard-info .name{font-size:14.5px; font-weight:700; color:var(--parchment);}
  .bcard-info .lv{font-size:11.5px; color:var(--parchment-dim); margin-top:1px;}
  .bcard-info .prod{font-size:11.5px; color:var(--green); margin-top:1px;}
  .bcard-lockmsg{font-size:11.5px; color:var(--danger); margin-top:6px;}

  .bcard .prog-wrap{margin-top:9px;}
  .prog-outer{
    height:8px; border-radius:5px; background:#241b10; overflow:hidden; border:1px solid #14100a;
  }
  .prog-inner{height:100%; background:linear-gradient(90deg, var(--green-dark), var(--green)); width:0%; transition:width .25s linear;}
  .prog-label{font-size:11px; color:var(--parchment-dim); margin-top:4px; text-align:center;}

  .upg-row{
    margin-top:9px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .upg-cost{font-size:11px; color:var(--parchment-dim); line-height:1.5;}
  .upg-cost span{white-space:nowrap; margin-right:6px;}
  .upg-cost span.bad{color:var(--danger);}
  .btn{
    border:none; border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:700;
    cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .btn-primary{background:linear-gradient(180deg,#8fce6f,#5d9e46); color:#183212;}
  .btn-primary:disabled{background:#4a5245; color:#8a9280; cursor:not-allowed;}
  .btn-sub{background:#5a4a30; color:var(--parchment);}
  .btn-sub:disabled{opacity:.4; cursor:not-allowed;}
  .btn-danger{background:linear-gradient(180deg,#e17a68,#b7402f); color:#2b0d08;}

  /* market */
  .mcard{
    background:linear-gradient(180deg, var(--panel-2) 0%, #2a2116 100%);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .mcard-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .mcard-head .ic{font-size:20px;}
  .mcard-head .t{font-size:14px; font-weight:700;}
  .mcard-head .rate{margin-left:auto; font-size:11px; color:var(--parchment-dim);}
  .trade-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .trade-btns .btn{flex:1; min-width:64px;}
  .mcard .sub-label{font-size:11px; color:var(--parchment-dim); margin:8px 0 4px;}

  .locked-note{
    text-align:center; color:var(--parchment-dim); font-size:12.5px;
    padding:30px 10px; line-height:1.7;
  }

  /* ---------- 拠点マップ(3D) ---------- */
  .scene-wrap{
    position:relative; border-radius:12px; overflow:hidden;
    border:2px solid #2f4a22; box-shadow:var(--shadow);
    background:#0c1a10; height:300px;
  }
  .scene-wrap canvas{display:block; width:100%; height:100%; touch-action:none;}
  .hud{
    position:absolute; left:8px; top:8px; right:8px;
    display:flex; align-items:flex-start; justify-content:space-between;
    pointer-events:none; gap:6px;
  }
  .hud-map{
    background:#000000aa; color:var(--parchment); font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px;
  }
  .hud-carry{
    background:#000000aa; color:var(--wood); font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .hud-action{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:#000000cc; color:var(--parchment); font-size:12px;
    padding:6px 14px; border-radius:20px; white-space:nowrap;
    opacity:0; transition:opacity .15s ease; pointer-events:none;
  }
  .hud-action.show{opacity:1;}
  .mgmt-btn{
    position:absolute; right:8px; bottom:10px;
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(180deg,#8fce6f,#5d9e46); border:none;
    font-size:17px; box-shadow:var(--shadow); cursor:pointer;
  }

  .dpad{
    display:grid; grid-template-columns:42px 42px 42px; grid-template-rows:42px 42px 42px;
    gap:4px; margin:12px auto 4px; width:fit-content;
  }
  .dpad button{
    background:var(--panel-2); border:1px solid var(--card-border); border-radius:8px;
    color:var(--parchment); font-size:15px; cursor:pointer;
  }
  .dpad button:active, .dpad button.pressed{background:var(--card);}
  .dpad .dp-up{grid-column:2; grid-row:1;}
  .dpad .dp-left{grid-column:1; grid-row:2;}
  .dpad .dp-right{grid-column:3; grid-row:2;}
  .dpad .dp-down{grid-column:2; grid-row:3;}

  #mgmtBuildingList .bcard:last-child{margin-bottom:0;}
  .panel-empty{
    text-align:center; color:var(--parchment-dim); font-size:12.5px;
    padding:16px 10px; line-height:1.6;
  }
  .sel-card{position:relative;}
  .panel-close{
    position:absolute; top:10px; right:10px; background:none; border:none;
    color:var(--parchment-dim); font-size:15px; cursor:pointer; padding:4px;
  }
  #mgmtModal .modal{max-width:380px; max-height:82vh; overflow-y:auto;}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:86px; transform:translate(-50%, 12px);
    background:#000000cc; color:var(--parchment); padding:8px 16px; border-radius:20px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
    max-width:80%; text-align:center;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}

  /* bottom nav */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    max-width:480px; margin:0 auto;
    display:flex;
    background:linear-gradient(180deg, #24331f 0%, #1a271a 100%);
    border-top:1px solid #0d150d;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; color:var(--parchment-dim);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 0 8px; font-size:10.5px; cursor:pointer;
  }
  nav button .ic{font-size:20px;}
  nav button.active{color:var(--gold);}

  /* modal */
  .modal-back{
    position:fixed; inset:0; background:#000000aa; z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-back[hidden]{display:none;}
  .modal{
    background:var(--panel); border:1px solid var(--card-border); border-radius:14px;
    padding:18px; width:100%; max-width:340px; box-shadow:var(--shadow);
  }
  .modal h2{margin:0 0 10px; font-size:15px;}
  .modal p{font-size:12.5px; color:var(--parchment-dim); line-height:1.7; margin:0 0 14px;}
  .modal .row{display:flex; gap:8px; justify-content:flex-end;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="titlebar">
      <h1>🏕️ フロンティア開拓記</h1>
      <button class="gear-btn" id="btnSettings" aria-label="設定">⚙️</button>
    </div>
    <div class="res-bar">
      <div class="res-chip wood">
        <div class="ic">🪵</div>
        <div style="flex:1;min-width:0;">
          <div class="num" id="resWoodNum">0 / 0</div>
          <div class="res-fill"><i id="resWoodFill" style="width:0%"></i></div>
        </div>
      </div>
      <div class="res-chip food">
        <div class="ic">🍖</div>
        <div style="flex:1;min-width:0;">
          <div class="num" id="resFoodNum">0 / 0</div>
          <div class="res-fill"><i id="resFoodFill" style="width:0%"></i></div>
        </div>
      </div>
      <div class="res-chip gold">
        <div class="ic">🪙</div>
        <div style="flex:1;min-width:0;">
          <div class="num" id="resGoldNum">0</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="view active" id="view-base">
      <div class="section-title">拠点</div>
      <div class="scene-wrap" id="sceneWrap">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
          <div class="hud-map" id="hudMapName">🏕️ 拠点</div>
          <div class="hud-carry" id="hudCarry">🪵 運搬中: 0</div>
        </div>
        <div class="hud-action" id="hudAction"></div>
        <button class="mgmt-btn" id="btnMgmt" aria-label="施設管理">🏗️</button>
      </div>
      <div class="dpad">
        <button class="dp-up" data-dir="up" aria-label="上へ">▲</button>
        <button class="dp-left" data-dir="left" aria-label="左へ">◀</button>
        <button class="dp-right" data-dir="right" aria-label="右へ">▶</button>
        <button class="dp-down" data-dir="down" aria-label="下へ">▼</button>
      </div>
      <div class="panel-empty">十字キーでプレイヤーを操作。🏗️ボタンで施設のアップグレードができます。</div>
    </div>

    <div class="view" id="view-market">
      <div class="section-title">市場</div>
      <div id="marketArea"></div>
    </div>
  </main>

  <div id="toast"></div>

  <nav>
    <button class="nav-btn active" data-view="view-base"><span class="ic">🏕️</span>拠点</button>
    <button class="nav-btn" data-view="view-market"><span class="ic">⚖️</span>市場</button>
  </nav>
</div>

<div class="modal-back" id="settingsModal" hidden>
  <div class="modal">
    <h2>⚙️ 設定</h2>
    <p>
      フロンティア開拓記 v<span id="verNum">0.1.0</span><br>
      データはこの端末のブラウザ内にのみ保存されます。
    </p>
    <div class="row">
      <button class="btn btn-danger" id="btnReset">データをリセット</button>
      <button class="btn btn-sub" id="btnCloseSettings">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-back" id="mgmtModal" hidden>
  <div class="modal">
    <h2>🏗️ 施設管理</h2>
    <div id="mgmtBuildingList"></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-sub" id="btnCloseMgmt">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   定義データ(バランス値は試作段階の仮値)
   ========================================================= */
const SAVE_KEY = "frontierOutpostSave";
const GAME_VERSION = 1;

const RES = {
  wood: { name:"木材", icon:"🪵" },
  food: { name:"食料", icon:"🍖" },
  gold: { name:"ゴールド", icon:"🪙" }
};

// 建物定義。costBase/costGrowth でLv毎コスト、timeBase/timeGrowthで建設時間(秒)。
const BUILDINGS = {
  townhall: {
    name:"本拠地", icon:"🏰", produces:null,
    unlockAt:0,
    costBase:{wood:80, food:80, gold:0},
    costGrowth:1.45,
    timeBase:25, timeGrowth:1.35, timeCap:900,
    desc:"拠点の中心。他の建物のレベル上限を広げる。"
  },
  lumber: {
    name:"伐採小屋", icon:"🪓", produces:"wood", rateBase:0.12, rateGrowth:1.18,
    unlockAt:0,
    costBase:{wood:0, food:40, gold:0},
    costGrowth:1.4,
    timeBase:15, timeGrowth:1.3, timeCap:600,
    desc:"木材を自動で生産する。"
  },
  hunting: {
    name:"狩猟小屋", icon:"🏹", produces:"food", rateBase:0.10, rateGrowth:1.18,
    unlockAt:0,
    costBase:{wood:40, food:0, gold:0},
    costGrowth:1.4,
    timeBase:15, timeGrowth:1.3, timeCap:600,
    desc:"食料(肉)を自動で生産する。"
  },
  warehouse: {
    name:"倉庫", icon:"📦", produces:null, capBase:250, capGrowth:1.25,
    unlockAt:2, // townhall lv2で解放
    costBase:{wood:60, food:20, gold:0},
    costGrowth:1.4,
    timeBase:20, timeGrowth:1.3, timeCap:600,
    desc:"木材・食料の貯蔵上限を広げる。"
  },
  market: {
    name:"市場", icon:"⚖️", produces:null,
    unlockAt:2, // townhall lv2で解放
    costBase:{wood:50, food:50, gold:0},
    costGrowth:1.4,
    timeBase:20, timeGrowth:1.3, timeCap:600,
    desc:"レベルが上がるほど取引の手数料が下がる。"
  }
};
const BUILD_ORDER = ["townhall","lumber","hunting","warehouse","market"];

const BASE_CAP = 300; // 倉庫Lv0でも確保できる最低貯蔵量

/* =========================================================
   状態
   ========================================================= */
let state = null;

function defaultState(){
  return {
    v: GAME_VERSION,
    resources: { wood:50, food:50, gold:20 },
    buildings: {
      townhall:{ level:1, upgrading:null },
      lumber:{ level:1, upgrading:null },
      hunting:{ level:1, upgrading:null },
      warehouse:{ level:0, upgrading:null },
      market:{ level:0, upgrading:null }
    },
    player: { map:"base", x:0, z:5, carryWood:0 },
    lastTick: Date.now()
  };
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed || parsed.v !== GAME_VERSION) return defaultState();
    if(!parsed.player) parsed.player = { map:"base", x:0, z:5, carryWood:0 }; // 旧セーブ互換
    return parsed;
  }catch(e){
    return defaultState();
  }
}
function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){ /* storage disabled (private mode / data: url) - ignore */ }
}

/* =========================================================
   計算ヘルパー
   ========================================================= */
function townhallLevel(){ return state.buildings.townhall.level; }

function maxLevelFor(id){
  if(id === "townhall") return 999;
  return townhallLevel() + 1; // 本拠地Lv+1までしか他建物は上げられない
}

// unlockAtは「本拠地がこのレベル以上で解放」。まだ建設(Lv0→1)していない建物も一覧には出す。
function isRevealed(id){
  const def = BUILDINGS[id];
  return townhallLevel() >= def.unlockAt;
}

function storageCap(){
  const w = state.buildings.warehouse.level;
  const def = BUILDINGS.warehouse;
  if(w <= 0) return BASE_CAP;
  return Math.round(BASE_CAP + def.capBase * Math.pow(def.capGrowth, w-1));
}

function costForLevel(id, targetLevel){
  const def = BUILDINGS[id];
  const factor = Math.pow(def.costGrowth, targetLevel-1);
  return {
    wood: Math.round((def.costBase.wood||0) * factor),
    food: Math.round((def.costBase.food||0) * factor),
    gold: Math.round((def.costBase.gold||0) * factor)
  };
}
function timeForLevel(id, targetLevel){
  const def = BUILDINGS[id];
  const factor = Math.pow(def.timeGrowth, targetLevel-1);
  return Math.min(def.timeCap, Math.round(def.timeBase * factor));
}
function rateForLevel(id, level){
  const def = BUILDINGS[id];
  if(!def.produces || level<=0) return 0;
  return def.rateBase * Math.pow(def.rateGrowth, level-1) * level; // レベルとともに単体効率も微増
}

/* =========================================================
   生産・オフライン進行
   ========================================================= */
function ratePerSec(resKey){
  let total = 0;
  for(const id of BUILD_ORDER){
    const def = BUILDINGS[id];
    if(def.produces === resKey){
      total += rateForLevel(id, state.buildings[id].level);
    }
  }
  return total;
}

function applyProduction(deltaSec){
  if(deltaSec <= 0) return;
  const cap = storageCap();
  state.resources.wood = Math.min(cap, state.resources.wood + ratePerSec("wood")*deltaSec);
  state.resources.food = Math.min(cap, state.resources.food + ratePerSec("food")*deltaSec);
}

function checkUpgradesComplete(now){
  let changed = false;
  for(const id of BUILD_ORDER){
    const b = state.buildings[id];
    if(b.upgrading && now >= b.upgrading.finishAt){
      b.level += 1;
      b.upgrading = null;
      changed = true;
      toast(`${BUILDINGS[id].icon} ${BUILDINGS[id].name} が Lv.${b.level} になった!`);
    }
  }
  return changed;
}

function tick(){
  const now = Date.now();
  const deltaSec = Math.max(0, (now - state.lastTick)/1000);
  applyProduction(deltaSec);
  checkUpgradesComplete(now);
  state.lastTick = now;
  render();
  save();
}

function processOfflineProgress(){
  const now = Date.now();
  let deltaSec = (now - state.lastTick)/1000;
  deltaSec = Math.max(0, Math.min(deltaSec, 24*3600)); // オフラインは最大24時間分まで
  applyProduction(deltaSec);
  checkUpgradesComplete(now);
  state.lastTick = now;
}

/* =========================================================
   アクション
   ========================================================= */
function canAfford(cost){
  return state.resources.wood >= cost.wood && state.resources.food >= cost.food && state.resources.gold >= cost.gold;
}
function spend(cost){
  state.resources.wood -= cost.wood;
  state.resources.food -= cost.food;
  state.resources.gold -= cost.gold;
}

function startUpgrade(id){
  const b = state.buildings[id];
  if(b.upgrading) return;
  const target = b.level + 1;
  if(target > maxLevelFor(id)) return;
  const cost = costForLevel(id, target);
  if(!canAfford(cost)) return;
  spend(cost);
  const time = timeForLevel(id, target);
  b.upgrading = { finishAt: Date.now() + time*1000, duration: time*1000 };
  render();
  save();
}

function sell(resKey, amount){
  const rate = MARKET_RATES[resKey].sell;
  amount = Math.min(amount, Math.floor(state.resources[resKey]));
  if(amount <= 0) return;
  state.resources[resKey] -= amount;
  state.resources.gold += Math.round(amount * rate);
  render(); save();
}
function buy(resKey, amount){
  const rate = MARKET_RATES[resKey].buy;
  const cost = Math.ceil(amount * rate);
  if(state.resources.gold < cost) { toast("ゴールドが足りない"); return; }
  const cap = storageCap();
  const room = cap - state.resources[resKey];
  if(room <= 0){ toast("倉庫が満杯"); return; }
  const actualAmount = Math.min(amount, room);
  const actualCost = Math.ceil(actualAmount * rate);
  state.resources.gold -= actualCost;
  state.resources[resKey] += actualAmount;
  render(); save();
}

const MARKET_RATES = {
  wood: { sell:0.28, buy:0.55 },
  food: { sell:0.35, buy:0.65 }
};

/* =========================================================
   拠点マップ(3D ワールド)
   ========================================================= */
// マップ寸法・配置(ワールド座標。1ユニット≒1マス相当)
const MAP_HALF = 9;                     // 拠点/森マップは一辺18の正方形
const DOOR_FROM = -1.6, DOOR_TO = 1.6;  // 門(扉)のx範囲
const COUNTER = { minX:-9, maxX:-7.6, minZ:-2.2, maxZ:2.2 }; // カウンター本体の当たり判定(西の柵に埋め込み)
const DEPOSIT_PT = { x:-6.6, z:-1.3 };  // 木材を置くポイント(カウンター左)
const TRADE_PT   = { x:-6.6, z: 1.3 };  // 売買するポイント(カウンター右)
const INTERACT_RADIUS = 1.5;
const HARVEST_RADIUS = 1.6;
const HARVEST_SECONDS = 3;              // 木に近づいてから木材化するまでの時間
const REGROW_SECONDS = 10;              // 伐採後に木が元に戻るまでの時間
const WOOD_PER_TREE = 3;
const PLAYER_SPEED = 4.2;               // units/sec
const SELL_RATE_PER_SEC = 2;            // カウンターでNPCが買い取る木材量(1秒あたり、在庫がある限り)

const TREE_DEFS = [ {x:-4,z:-3}, {x:4,z:-3}, {x:-4,z:3}, {x:4,z:3} ]; // まずは木を4本

let world = null;           // three.js関連オブジェクト一式(initSceneで構築)
let trees = TREE_DEFS.map(p => ({ x:p.x, z:p.z, state:"tree", progress:0, stumpUntil:0, mesh:null }));
let heldDir = null;         // 十字キーで押下中の方向
let harvestingTreeIdx = -1; // 現在伐採進行中の木(HUD表示用)
let sellAccum = 0;          // 売却の端数を貯める累積器
let lastFrameTime = null;

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function distTo(x,z,px,pz){ const dx=x-px, dz=z-pz; return Math.sqrt(dx*dx+dz*dz); }
function inDoorGap(x){ return x >= DOOR_FROM && x <= DOOR_TO; }

function blockedInBase(x,z){
  if(z >= MAP_HALF-0.35 && !inDoorGap(x)) return true;               // 南の柵(門以外)
  if(z <= -MAP_HALF+0.35) return true;                                // 北の柵
  if(x >= MAP_HALF-0.35) return true;                                 // 東の柵
  if(x <= -MAP_HALF+0.35 && !(z>=COUNTER.minZ-0.5 && z<=COUNTER.maxZ+0.5)) return true; // 西の柵(カウンター部分以外)
  if(x>=COUNTER.minX-0.5 && x<=COUNTER.maxX+0.6 && z>=COUNTER.minZ && z<=COUNTER.maxZ) return true; // カウンター本体
  return false;
}
function blockedInForest(x,z){
  if(z <= -MAP_HALF+0.35 && !inDoorGap(x)) return true; // 北側(拠点へ戻る門以外)
  if(z >= MAP_HALF-0.35) return true;
  if(x <= -MAP_HALF+0.35 || x >= MAP_HALF-0.35) return true;
  for(const t of trees){
    if(t.state !== "tree") continue;
    if(distTo(t.x,t.z,x,z) < 0.7) return true; // 木の幹に重ならない
  }
  return false;
}

function addBox(group, mat, x,y,z, sx,sy,sz){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mat);
  mesh.position.set(x,y,z);
  group.add(mesh);
  return mesh;
}
function addPad(group, x,z,color){
  const mesh = new THREE.Mesh(new THREE.CircleGeometry(0.6,24), new THREE.MeshStandardMaterial({ color }));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0.03, z);
  group.add(mesh);
}
function addNpcFigure(group, x,z){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.9,10), new THREE.MeshStandardMaterial({color:0x6f7f9c}));
  body.position.y = 0.55;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26,10,10), new THREE.MeshStandardMaterial({color:0xe8c39e}));
  head.position.y = 1.15;
  g.add(body, head);
  g.position.set(x, 0, z);
  group.add(g);
}
function makeFence(group, color){
  const mat = new THREE.MeshStandardMaterial({ color });
  const southLeftW = DOOR_FROM - (-MAP_HALF), southRightW = MAP_HALF - DOOR_TO;
  addBox(group, mat, (-MAP_HALF+DOOR_FROM)/2, 0.8, MAP_HALF, southLeftW, 1.6, 0.4);   // 南・門の左
  addBox(group, mat, (DOOR_TO+MAP_HALF)/2, 0.8, MAP_HALF, southRightW, 1.6, 0.4);     // 南・門の右
  addBox(group, mat, 0, 0.8, -MAP_HALF, MAP_HALF*2, 1.6, 0.4);                        // 北
  addBox(group, mat, MAP_HALF, 0.8, 0, 0.4, 1.6, MAP_HALF*2);                         // 東
  const westTopLen = MAP_HALF - COUNTER.maxZ, westBotLen = COUNTER.minZ - (-MAP_HALF);
  addBox(group, mat, -MAP_HALF, 0.8, (COUNTER.maxZ+MAP_HALF)/2, 0.4, 1.6, westTopLen);      // 西・上
  addBox(group, mat, -MAP_HALF, 0.8, (-MAP_HALF+COUNTER.minZ)/2, 0.4, 1.6, westBotLen);     // 西・下
  const postMat = new THREE.MeshStandardMaterial({ color:0x5a4128 });
  addBox(group, postMat, DOOR_FROM, 1.1, MAP_HALF, 0.3, 2.2, 0.3); // 門柱
  addBox(group, postMat, DOOR_TO, 1.1, MAP_HALF, 0.3, 2.2, 0.3);
}
function buildBaseGroup(){
  const group = new THREE.Group();
  addBox(group, new THREE.MeshStandardMaterial({color:0x6b9c48}), 0,-0.1,0, MAP_HALF*2, 0.2, MAP_HALF*2); // 地面
  makeFence(group, 0x8a6b3f);
  addBox(group, new THREE.MeshStandardMaterial({color:0x7a5a34}), -7.8, 0.5, 0, 2.4, 1.0, 4.6);  // カウンター本体
  addBox(group, new THREE.MeshStandardMaterial({color:0x5c4326}), -7.8, 1.05, 0, 2.6, 0.15, 4.8); // 天板
  addPad(group, DEPOSIT_PT.x, DEPOSIT_PT.z, 0xc98a4b); // 木材を置くポイント
  addPad(group, TRADE_PT.x, TRADE_PT.z, 0xf0c245);     // 売買するポイント
  addNpcFigure(group, -10.6, -1.3); // 柵の外で待機するNPC(見た目のみ)
  addNpcFigure(group, -11.6, -1.3);
  return group;
}
function buildTreeMesh(t){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,0.9,8), new THREE.MeshStandardMaterial({color:0x6b4a2b}));
  trunk.position.y = 0.45; trunk.name = "trunk";
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.1,1.8,9), new THREE.MeshStandardMaterial({color:0x3f7d3a}));
  leaves.position.y = 1.7; leaves.name = "leaves";
  g.add(trunk, leaves);
  g.position.set(t.x, 0, t.z);
  return g;
}
function setTreeVisual(t){
  if(!t.mesh) return;
  const trunk = t.mesh.getObjectByName("trunk"), leaves = t.mesh.getObjectByName("leaves");
  if(t.state === "tree"){ trunk.scale.set(1,1,1); trunk.position.y = 0.45; leaves.visible = true; }
  else { trunk.scale.set(1,0.4,1); trunk.position.y = 0.18; leaves.visible = false; }
}
function buildForestGroup(){
  const group = new THREE.Group();
  addBox(group, new THREE.MeshStandardMaterial({color:0x3f5e2f}), 0,-0.1,0, MAP_HALF*2, 0.2, MAP_HALF*2); // 森の地面
  const postMat = new THREE.MeshStandardMaterial({ color:0x5a4128 });
  addBox(group, postMat, DOOR_FROM, 1.1, -MAP_HALF, 0.3, 2.2, 0.3); // 拠点へ戻る門枠
  addBox(group, postMat, DOOR_TO, 1.1, -MAP_HALF, 0.3, 2.2, 0.3);
  for(const t of trees){ t.mesh = buildTreeMesh(t); group.add(t.mesh); }
  return group;
}
function buildPlayerMesh(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.36,0.95,12), new THREE.MeshStandardMaterial({color:0x4f8fe0}));
  body.position.y = 0.58;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28,12,12), new THREE.MeshStandardMaterial({color:0xf0c79a}));
  head.position.y = 1.22;
  g.add(body, head);
  return g;
}

function initScene(){
  const canvas = document.getElementById("gameCanvas");
  const wrap = document.getElementById("sceneWrap");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c1a10);
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(6,10,4);
  scene.add(sun);

  const baseGroup = buildBaseGroup();
  const forestGroup = buildForestGroup();
  scene.add(baseGroup, forestGroup);
  const playerMesh = buildPlayerMesh();
  scene.add(playerMesh);

  world = { renderer, scene, camera, baseGroup, forestGroup, playerMesh, wrap };
  resizeScene();
  window.addEventListener("resize", resizeScene);
  syncMapVisibility();
  updatePlayerMesh();
  requestAnimationFrame(animate);
}
function resizeScene(){
  if(!world) return;
  const w = world.wrap.clientWidth, h = world.wrap.clientHeight;
  if(w<=0||h<=0) return;
  world.renderer.setSize(w, h, false);
  world.camera.aspect = w/h;
  world.camera.updateProjectionMatrix();
}
function syncMapVisibility(){
  if(!world) return;
  const onBase = state.player.map === "base";
  world.baseGroup.visible = onBase;
  world.forestGroup.visible = !onBase;
}
function updatePlayerMesh(){
  if(!world) return;
  world.playerMesh.position.set(state.player.x, 0, state.player.z);
  world.camera.position.set(state.player.x, 9.5, state.player.z + 7.5);
  world.camera.lookAt(state.player.x, 0, state.player.z);
}

// --- 移動 -----------------------------------------------------------
function tryMove(dx,dz){
  const p = state.player;
  const nx = clamp(p.x+dx, -MAP_HALF+0.3, MAP_HALF-0.3);
  const nz = clamp(p.z+dz, -MAP_HALF+0.3, MAP_HALF-0.3);
  if(p.map === "base"){
    if(nz > MAP_HALF-0.35 && inDoorGap(nx)){
      p.map = "forest"; p.x = clamp(nx,-1.5,1.5); p.z = -MAP_HALF+0.6;
      syncMapVisibility(); toast("🌲 森に入った"); save(); return;
    }
    if(!blockedInBase(nx, p.z)) p.x = nx;
    if(!blockedInBase(p.x, nz)) p.z = nz;
  } else {
    if(nz < -MAP_HALF+0.35 && inDoorGap(nx)){
      p.map = "base"; p.x = clamp(nx,-1.5,1.5); p.z = MAP_HALF-0.6;
      syncMapVisibility(); toast("🏕️ 拠点に戻った"); save(); return;
    }
    if(!blockedInForest(nx, p.z)) p.x = nx;
    if(!blockedInForest(p.x, nz)) p.z = nz;
  }
}

// --- 森: 木の伐採 -----------------------------------------------------
function updateForestInteraction(dt){
  const p = state.player;
  let nearIdx = -1;
  for(let i=0;i<trees.length;i++){
    if(trees[i].state === "tree" && distTo(trees[i].x,trees[i].z,p.x,p.z) <= HARVEST_RADIUS){ nearIdx = i; break; }
  }
  if(nearIdx >= 0){
    const t = trees[nearIdx];
    t.progress += dt;
    harvestingTreeIdx = nearIdx;
    if(t.progress >= HARVEST_SECONDS){
      t.state = "stump"; t.progress = 0; t.stumpUntil = Date.now() + REGROW_SECONDS*1000;
      setTreeVisual(t);
      p.carryWood += WOOD_PER_TREE;
      toast(`🪓 木材を${WOOD_PER_TREE}手に入れた!`);
      updateHud(); save();
      harvestingTreeIdx = -1;
    }
  } else {
    for(const t of trees) if(t.state === "tree") t.progress = 0;
    harvestingTreeIdx = -1;
  }
  const now = Date.now();
  for(const t of trees){
    if(t.state === "stump" && now >= t.stumpUntil){ t.state = "tree"; setTreeVisual(t); }
  }
}

// --- 拠点: 木材カウンター ---------------------------------------------
function updateBaseInteraction(dt){
  const p = state.player;
  if(p.carryWood > 0 && distTo(DEPOSIT_PT.x,DEPOSIT_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    const room = Math.max(0, storageCap() - state.resources.wood);
    const move = Math.min(p.carryWood, room);
    if(move > 0){
      state.resources.wood += move; p.carryWood -= move;
      renderResBar(); updateHud(); save();
      toast(`📦 木材${move}をカウンターに置いた`);
    } else {
      toast("倉庫が満杯で置けない");
    }
  }
  if(distTo(TRADE_PT.x,TRADE_PT.z,p.x,p.z) <= INTERACT_RADIUS && state.resources.wood > 0){
    sellAccum += SELL_RATE_PER_SEC*dt;
    const units = Math.floor(sellAccum + 1e-9); // 浮動小数の誤差で端数が1未満に張り付くのを防ぐ
    if(units > 0){
      const actual = Math.min(units, Math.floor(state.resources.wood));
      sellAccum -= units;
      if(actual > 0){
        state.resources.wood -= actual;
        state.resources.gold += actual * MARKET_RATES.wood.sell; // 端数を丸めない(小口取引の連続でゴールドが消えないように)
        renderResBar(); save();
      }
    }
    showAction("💰 NPCに木材を売却中…");
  } else {
    sellAccum = 0;
    if(state.player.map === "base") hideAction();
  }
}

function showAction(text){
  const el = document.getElementById("hudAction");
  el.textContent = text;
  el.classList.add("show");
}
function hideAction(){ document.getElementById("hudAction").classList.remove("show"); }
function updateHud(){
  document.getElementById("hudMapName").textContent = state.player.map==="base" ? "🏕️ 拠点" : "🌲 森";
  document.getElementById("hudCarry").textContent = `🪵 運搬中: ${state.player.carryWood}`;
  if(state.player.map === "forest"){
    if(harvestingTreeIdx>=0){
      const pct = Math.min(100, Math.round(trees[harvestingTreeIdx].progress/HARVEST_SECONDS*100));
      showAction(`🪓 伐採中… ${pct}%`);
    } else {
      hideAction();
    }
  }
}

function animate(ts){
  requestAnimationFrame(animate);
  if(!world) return;
  if(lastFrameTime === null) lastFrameTime = ts;
  const dt = Math.min(0.1, (ts - lastFrameTime)/1000);
  lastFrameTime = ts;

  const baseTabActive = document.getElementById("view-base").classList.contains("active");
  if(heldDir && baseTabActive){
    let dx=0, dz=0;
    if(heldDir==="up") dz=-1; else if(heldDir==="down") dz=1;
    else if(heldDir==="left") dx=-1; else if(heldDir==="right") dx=1;
    tryMove(dx*PLAYER_SPEED*dt, dz*PLAYER_SPEED*dt);
  }
  if(state.player.map === "forest") updateForestInteraction(dt);
  else updateBaseInteraction(dt);
  updateHud();
  updatePlayerMesh();
  world.renderer.render(world.scene, world.camera);
}

/* =========================================================
   描画
   ========================================================= */
function fmt(n){
  n = Math.floor(n);
  if(n >= 100000) return (n/1000).toFixed(1)+"k";
  return n.toLocaleString("ja-JP");
}
function fmtTime(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if(h>0) return `${h}時間${m}分`;
  if(m>0) return `${m}分${sec}秒`;
  return `${sec}秒`;
}

function renderResBar(){
  const cap = storageCap();
  document.getElementById("resWoodNum").textContent = `${fmt(state.resources.wood)} / ${fmt(cap)}`;
  document.getElementById("resFoodNum").textContent = `${fmt(state.resources.food)} / ${fmt(cap)}`;
  document.getElementById("resGoldNum").textContent = fmt(state.resources.gold);
  document.getElementById("resWoodFill").style.width = Math.min(100, state.resources.wood/cap*100)+"%";
  document.getElementById("resFoodFill").style.width = Math.min(100, state.resources.food/cap*100)+"%";
}

// 建物1件分のカード中身(拠点パネルで使う)
function buildingCardInner(id){
  const def = BUILDINGS[id];
  const b = state.buildings[id];
  const now = Date.now();
  const target = b.level + 1;
  const atCap = target > maxLevelFor(id);
  const cost = !atCap ? costForLevel(id, target) : null;
  const time = !atCap ? timeForLevel(id, target) : null;

  let prodLine = "";
  if(def.produces){
    const rate = rateForLevel(id, b.level);
    prodLine = `<div class="prod">${RES[def.produces].icon} +${rate.toFixed(2)}/秒</div>`;
  } else if(id === "warehouse"){
    prodLine = `<div class="prod">貯蔵上限 ${fmt(storageCap())}</div>`;
  } else if(id === "market"){
    prodLine = `<div class="prod">手数料 ${Math.max(0, 15 - b.level*2)}%引き</div>`;
  } else if(id === "townhall"){
    prodLine = `<div class="prod">他施設の上限 Lv.${maxLevelFor("lumber")}</div>`;
  }

  let bottom = "";
  if(b.upgrading){
    const remain = b.upgrading.finishAt - now;
    const pct = 100 - Math.max(0, Math.min(100, remain / b.upgrading.duration * 100));
    bottom = `<div class="prog-wrap">
      <div class="prog-outer"><div class="prog-inner" style="width:${pct}%"></div></div>
      <div class="prog-label">建設中… 残り ${fmtTime(remain)}</div>
    </div>`;
  } else if(atCap){
    bottom = `<div class="upg-row">
      <div class="upg-cost bad">本拠地を先にLvアップしてください</div>
      <button class="btn btn-sub" disabled>上限</button>
    </div>`;
  } else {
    const afford = canAfford(cost);
    const costParts = [];
    if(cost.wood) costParts.push(`<span class="${state.resources.wood<cost.wood?'bad':''}">🪵${fmt(cost.wood)}</span>`);
    if(cost.food) costParts.push(`<span class="${state.resources.food<cost.food?'bad':''}">🍖${fmt(cost.food)}</span>`);
    if(cost.gold) costParts.push(`<span class="${state.resources.gold<cost.gold?'bad':''}">🪙${fmt(cost.gold)}</span>`);
    bottom = `<div class="upg-row">
      <div class="upg-cost">${costParts.join("")}<br>⏱ ${fmtTime(time*1000)}</div>
      <button class="btn btn-primary" data-upg="${id}" ${afford?"":"disabled"}>Lv.${target}へ</button>
    </div>`;
  }

  return `<div class="bcard-top">
      <div class="bcard-icon">${def.icon}</div>
      <div class="bcard-info">
        <div class="name">${def.name}</div>
        <div class="lv">Lv.${b.level}${id!=="townhall" ? " / "+maxLevelFor(id) : ""}</div>
        ${prodLine}
      </div>
    </div>
    ${bottom}`;
}

// 施設管理モーダルの建物一覧(拠点マップから🏗️ボタンで開く)
function renderMgmtList(){
  const wrap = document.getElementById("mgmtBuildingList");
  if(!wrap) return;
  let html = "";
  for(const id of BUILD_ORDER){
    if(!isRevealed(id)){
      html += `<div class="bcard locked"><div class="bcard-top">
        <div class="bcard-icon">🔒</div>
        <div class="bcard-info"><div class="name">???</div>
        <div class="lv">本拠地 Lv.${BUILDINGS[id].unlockAt} で解放</div></div>
      </div></div>`;
      continue;
    }
    html += `<div class="bcard">${buildingCardInner(id)}</div>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll("[data-upg]").forEach(btn=>{
    btn.addEventListener("click", ()=> startUpgrade(btn.getAttribute("data-upg")));
  });
}

function renderMarket(){
  const wrap = document.getElementById("marketArea");
  const marketLv = state.buildings.market.level;
  if(marketLv <= 0){
    wrap.innerHTML = `<div class="locked-note">⚖️ 市場が未建設です<br>拠点タブで「市場」を建設すると<br>資源の売買ができるようになります。</div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="mcard">
      <div class="mcard-head"><span class="ic">🪵</span><span class="t">木材を売買</span>
        <span class="rate">売${MARKET_RATES.wood.sell}/買${MARKET_RATES.wood.buy} 🪙</span></div>
      <div class="sub-label">売る</div>
      <div class="trade-btns">
        <button class="btn btn-sub" data-sell="wood" data-amt="10">10個</button>
        <button class="btn btn-sub" data-sell="wood" data-amt="50">50個</button>
        <button class="btn btn-sub" data-sell="wood" data-amt="99999">全部</button>
      </div>
      <div class="sub-label">買う</div>
      <div class="trade-btns">
        <button class="btn btn-sub" data-buy="wood" data-amt="10">10個</button>
        <button class="btn btn-sub" data-buy="wood" data-amt="50">50個</button>
      </div>
    </div>
    <div class="mcard">
      <div class="mcard-head"><span class="ic">🍖</span><span class="t">食料を売買</span>
        <span class="rate">売${MARKET_RATES.food.sell}/買${MARKET_RATES.food.buy} 🪙</span></div>
      <div class="sub-label">売る</div>
      <div class="trade-btns">
        <button class="btn btn-sub" data-sell="food" data-amt="10">10個</button>
        <button class="btn btn-sub" data-sell="food" data-amt="50">50個</button>
        <button class="btn btn-sub" data-sell="food" data-amt="99999">全部</button>
      </div>
      <div class="sub-label">買う</div>
      <div class="trade-btns">
        <button class="btn btn-sub" data-buy="food" data-amt="10">10個</button>
        <button class="btn btn-sub" data-buy="food" data-amt="50">50個</button>
      </div>
    </div>
  `;
  wrap.querySelectorAll("[data-sell]").forEach(btn=>{
    btn.addEventListener("click", ()=> sell(btn.getAttribute("data-sell"), parseInt(btn.getAttribute("data-amt"),10)));
  });
  wrap.querySelectorAll("[data-buy]").forEach(btn=>{
    btn.addEventListener("click", ()=> buy(btn.getAttribute("data-buy"), parseInt(btn.getAttribute("data-amt"),10)));
  });
}

function render(){
  renderResBar();
  renderMgmtList();
  renderMarket();
}

/* =========================================================
   トースト
   ========================================================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
}

/* =========================================================
   タブ切替
   ========================================================= */
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.getAttribute("data-view")).classList.add("active");
  });
});

/* =========================================================
   十字キー(押している間だけ3Dワールド内を移動し続ける)
   ========================================================= */
document.querySelectorAll(".dpad [data-dir]").forEach(btn=>{
  const dir = btn.getAttribute("data-dir");
  const start = (e)=>{ e.preventDefault(); heldDir = dir; btn.classList.add("pressed"); };
  const end = ()=>{ if(heldDir===dir) heldDir=null; btn.classList.remove("pressed"); };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", end);
  btn.addEventListener("pointercancel", end);
});

/* =========================================================
   施設管理モーダル
   ========================================================= */
document.getElementById("btnMgmt").addEventListener("click", ()=>{
  renderMgmtList();
  document.getElementById("mgmtModal").hidden = false;
});
document.getElementById("btnCloseMgmt").addEventListener("click", ()=>{
  document.getElementById("mgmtModal").hidden = true;
});

/* =========================================================
   設定モーダル
   ========================================================= */
document.getElementById("btnSettings").addEventListener("click", ()=>{
  document.getElementById("settingsModal").hidden = false;
});
document.getElementById("btnCloseSettings").addEventListener("click", ()=>{
  document.getElementById("settingsModal").hidden = true;
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  if(confirm("本当にすべてのデータをリセットしますか?この操作は元に戻せません。")){
    localStorage.removeItem(SAVE_KEY);
    state = defaultState();
    trees.forEach(t=>{ t.state="tree"; t.progress=0; t.stumpUntil=0; setTreeVisual(t); });
    harvestingTreeIdx = -1;
    document.getElementById("settingsModal").hidden = true;
    render();
    syncMapVisibility();
    updatePlayerMesh();
    save();
    toast("データをリセットしました");
  }
});
document.getElementById("verNum").textContent =
  document.querySelector('meta[name="app-version"]').content;

/* =========================================================
   起動
   ========================================================= */
state = load();
processOfflineProgress();
render();
initScene();
save();
setInterval(tick, 1000);

// タブを再表示した時にもオフライン分を反映
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    processOfflineProgress();
    render();
    save();
  }
});

// Service Worker登録(失敗しても無視)
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

})();
</script>

</html>
