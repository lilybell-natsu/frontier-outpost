<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3a2a">
<meta name="app-version" content="0.17.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開拓記">
<title>フロンティア開拓記</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg-1:#1c2a1c;
    --bg-2:#2b3a2a;
    --panel:#33291f;
    --panel-2:#3d3122;
    --card:#4a3b28;
    --card-border:#6b5638;
    --parchment:#e9dcbb;
    --parchment-dim:#c9bb94;
    --wood:#c98a4b;
    --food:#e0725a;
    --gold:#f0c245;
    --green:#7cb662;
    --green-dark:#4c8a3a;
    --danger:#d1594a;
    --shadow: 0 4px 10px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:
      radial-gradient(circle at 50% -10%, #35492f 0%, var(--bg-1) 55%, #131d13 100%);
    color:var(--parchment);
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Header / resource bar ---------- */
  header{
    position:sticky; top:0; z-index:10;
    padding:10px 10px 8px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(180deg, #24331f 0%, #1c2a1c 100%);
    border-bottom:1px solid #0d150d;
    box-shadow:var(--shadow);
  }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .titlebar h1{
    font-size:15px; margin:0; letter-spacing:.05em; color:var(--parchment);
    display:flex; align-items:center; gap:6px;
  }
  .gear-btn{
    background:none; border:none; color:var(--parchment-dim);
    font-size:18px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  .res-bar{
    display:flex; gap:6px;
  }
  .res-chip{
    flex:1;
    background:var(--panel);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:5px 6px;
    display:flex; align-items:center; gap:5px;
    min-width:0;
  }
  .res-chip .ic{font-size:16px;}
  .res-chip .num{
    font-size:12.5px; font-weight:600; color:var(--parchment);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .res-chip .num small{color:var(--parchment-dim); font-weight:400;}
  .res-chip.gold .num{color:var(--gold);}
  .res-fill{
    height:3px; border-radius:2px; margin-top:3px; background:#00000055; overflow:hidden;
  }
  .res-fill i{display:block; height:100%; background:var(--green); transition:width .3s;}
  .res-chip.food .res-fill i{background:var(--food);}
  .res-chip.wood .res-fill i{background:var(--wood);}

  /* ---------- Main / views ---------- */
  main{flex:1; padding:12px 10px 90px; overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .section-title{
    font-size:12.5px; color:var(--parchment-dim); margin:14px 2px 8px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .section-title:first-child{margin-top:0;}

  .btn{
    border:none; border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:700;
    cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .btn-sub{background:#5a4a30; color:var(--parchment);}
  .btn-sub:disabled{opacity:.4; cursor:not-allowed;}
  .btn-danger{background:linear-gradient(180deg,#e17a68,#b7402f); color:#2b0d08;}

  /* market */
  .mcard{
    background:linear-gradient(180deg, var(--panel-2) 0%, #2a2116 100%);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .mcard-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .mcard-head .ic{font-size:20px;}
  .mcard-head .t{font-size:14px; font-weight:700;}
  .mcard-head .rate{margin-left:auto; font-size:11px; color:var(--parchment-dim);}
  .trade-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .trade-btns .btn{flex:1; min-width:64px;}
  .mcard .sub-label{font-size:11px; color:var(--parchment-dim); margin:8px 0 4px;}

  .locked-note{
    text-align:center; color:var(--parchment-dim); font-size:12.5px;
    padding:30px 10px; line-height:1.7;
  }

  /* ---------- 拠点マップ(3D) ---------- */
  .scene-wrap{
    position:relative; border-radius:12px; overflow:hidden;
    border:2px solid #2f4a22; box-shadow:var(--shadow);
    background:#0c1a10; height:460px;
  }
  .scene-wrap canvas{display:block; width:100%; height:100%; touch-action:none;}
  .hud{
    position:absolute; left:8px; top:8px; right:8px;
    display:flex; align-items:flex-start; justify-content:space-between;
    pointer-events:none; gap:6px;
  }
  .hud-map{
    background:#000000aa; color:var(--parchment); font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px;
  }
  .hud-carry{
    background:#000000aa; color:var(--wood); font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .hud-action{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:#000000cc; color:var(--parchment); font-size:12px;
    padding:6px 14px; border-radius:20px; white-space:nowrap;
    opacity:0; transition:opacity .15s ease; pointer-events:none;
  }
  .hud-action.show{opacity:1;}
  .pt-label{
    position:absolute; transform:translate(-50%,-140%);
    padding:3px 8px; border-radius:10px; font-size:10.5px; font-weight:700;
    white-space:nowrap; pointer-events:none; box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .pt-label.dep{ background:#c98a4bdd; color:#2a1a0a; }
  .pt-label.trd{ background:#f0c245dd; color:#3a2a05; }

  .dpad{
    position:absolute; left:8px; bottom:8px; z-index:6;
    display:grid; grid-template-columns:36px 36px 36px; grid-template-rows:36px 36px 36px;
    gap:3px;
  }
  .dpad button{
    background:#00000088; border:1px solid #ffffff33; border-radius:8px;
    color:var(--parchment); font-size:14px; cursor:pointer;
  }
  .dpad button:active, .dpad button.pressed{background:#000000cc;}
  .dpad .dp-up{grid-column:2; grid-row:1;}
  .dpad .dp-left{grid-column:1; grid-row:2;}
  .dpad .dp-right{grid-column:3; grid-row:2;}
  .dpad .dp-down{grid-column:2; grid-row:3;}

  .ctx-btn{
    position:absolute; right:8px; bottom:8px; z-index:6;
    background:linear-gradient(180deg,#f0c245,#c9982a); color:#3a2a05;
    border:none; border-radius:20px; padding:9px 14px; font-size:12px; font-weight:700;
    box-shadow:var(--shadow); cursor:pointer;
  }
  .ctx-btn[hidden]{display:none;}

  .panel-empty{
    text-align:center; color:var(--parchment-dim); font-size:12.5px;
    padding:16px 10px; line-height:1.6;
  }

  .eff-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 0; border-bottom:1px solid var(--card-border);
  }
  .eff-row:last-child{border-bottom:none;}
  .eff-row.selected{ background:#00000033; border-radius:8px; outline:2px solid var(--gold); outline-offset:-2px; }
  .eff-info .name{font-size:13px; font-weight:700; color:var(--parchment);}
  .eff-info .lv{font-size:11px; color:var(--parchment-dim); margin-top:2px;}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:86px; transform:translate(-50%, 12px);
    background:#000000cc; color:var(--parchment); padding:8px 16px; border-radius:20px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
    max-width:80%; text-align:center;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}

  /* bottom nav */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    max-width:480px; margin:0 auto;
    display:flex;
    background:linear-gradient(180deg, #24331f 0%, #1a271a 100%);
    border-top:1px solid #0d150d;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; color:var(--parchment-dim);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 0 8px; font-size:10.5px; cursor:pointer;
  }
  nav button .ic{font-size:20px;}
  nav button.active{color:var(--gold);}

  /* modal */
  .modal-back{
    position:fixed; inset:0; background:#000000aa; z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-back[hidden]{display:none;}
  .modal{
    background:var(--panel); border:1px solid var(--card-border); border-radius:14px;
    padding:18px; width:100%; max-width:340px; box-shadow:var(--shadow);
  }
  .modal h2{margin:0 0 10px; font-size:15px;}
  .modal p{font-size:12.5px; color:var(--parchment-dim); line-height:1.7; margin:0 0 14px;}
  .modal .row{display:flex; gap:8px; justify-content:flex-end;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="titlebar">
      <h1>🏕️ フロンティア開拓記</h1>
      <button class="gear-btn" id="btnSettings" aria-label="設定">⚙️</button>
    </div>
    <div class="res-bar">
      <div class="res-chip wood">
        <div class="ic">🪵</div>
        <div style="flex:1;min-width:0;">
          <div class="num" id="resWoodNum">0 / 0</div>
          <div class="res-fill"><i id="resWoodFill" style="width:0%"></i></div>
        </div>
      </div>
      <div class="res-chip food">
        <div class="ic">🍖</div>
        <div style="flex:1;min-width:0;">
          <div class="num" id="resFoodNum">0 / 0</div>
          <div class="res-fill"><i id="resFoodFill" style="width:0%"></i></div>
        </div>
      </div>
      <div class="res-chip gold">
        <div class="ic">🪙</div>
        <div style="flex:1;min-width:0;">
          <div class="num" id="resGoldNum">0</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="view active" id="view-base">
      <div class="section-title">拠点</div>
      <div class="scene-wrap" id="sceneWrap">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
          <div class="hud-map" id="hudMapName">🏕️ 拠点</div>
          <div class="hud-carry" id="hudCarry">🪵 運搬中: 0</div>
        </div>
        <div class="pt-label dep" id="lblDeposit">📦 置き場</div>
        <div class="pt-label trd" id="lblTrade">💰 売買</div>
        <div class="hud-action" id="hudAction"></div>
        <button class="ctx-btn" id="ctxBtn" hidden></button>
        <div class="dpad">
          <button class="dp-up" data-dir="up" aria-label="上へ">▲</button>
          <button class="dp-left" data-dir="left" aria-label="左へ">◀</button>
          <button class="dp-right" data-dir="right" aria-label="右へ">▶</button>
          <button class="dp-down" data-dir="down" aria-label="下へ">▼</button>
        </div>
      </div>
      <div class="panel-empty">十字キー(PCは矢印キーも可)でプレイヤーを操作。森で木材を集めてカウンターに運ぼう。</div>
    </div>

    <div class="view" id="view-market">
      <div class="section-title">市場</div>
      <div id="marketArea"></div>
    </div>
  </main>

  <div id="toast"></div>

  <nav>
    <button class="nav-btn active" data-view="view-base"><span class="ic">🏕️</span>拠点</button>
    <button class="nav-btn" data-view="view-market"><span class="ic">⚖️</span>市場</button>
  </nav>
</div>

<div class="modal-back" id="settingsModal" hidden>
  <div class="modal">
    <h2>⚙️ 設定</h2>
    <p>
      フロンティア開拓記 v<span id="verNum">0.1.0</span><br>
      データはこの端末のブラウザ内にのみ保存されます。
    </p>
    <div class="row">
      <button class="btn btn-danger" id="btnReset">データをリセット</button>
      <button class="btn btn-sub" id="btnCloseSettings">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-back" id="effModal" hidden>
  <div class="modal">
    <h2>🛠️ 効率化</h2>
    <div id="effList"></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-sub" id="btnCloseEff">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-back" id="npcModal" hidden>
  <div class="modal">
    <h2>👷 NPCカウンター</h2>
    <div id="npcHireList"></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-sub" id="btnCloseNpc">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   定義データ(バランス値は試作段階の仮値)
   ========================================================= */
const SAVE_KEY = "frontierOutpostSave";
const GAME_VERSION = 1;
const STORAGE_CAP = 9999; // 木材・食料の貯蔵上限(固定値)
const CARRY_CAP = 9999;   // プレイヤーが運搬できる木材の上限

/* =========================================================
   状態
   ========================================================= */
let state = null;

function defaultState(){
  return {
    v: GAME_VERSION,
    resources: { wood:0, food:0, gold:0 },
    player: { x: PLAYER_SPAWN.x, z: PLAYER_SPAWN.z, carryWood:6 },
    harvestWorkers: [], // 伐採NPC(雇用中の個体、最大5体)
    sellWorkers: [],    // 売買NPC(雇用中の個体、最大5体)
    hiredLastTick: Date.now(),
    upgrades: { amount:0, speed:0, price:0 },
    // 伐採自動化(森にマシンを設置)・売買自動化(カウンターにNPCを常駐)。
    // 通常の雇用NPC(単発・消耗式)とは別枠の、Gで導入する常設の全自動生産ライン。
    // 生産物は自動化収集ボックス(木材収集ボックス=boxWood/G収集ボックス=boxGold)に貯まり、
    // どちらも拠点内に設置されるので、プレイヤーは拠点から出ずに回収できる
    automation: {
      // 伐採マシンはレベルアップで台数が増える(1レベル=1台)。machinesは稼働中の台数ぶんの配列で、
      // 各要素が{treeIdx,pos,progress,arrived,stepTimer}を持つ(雇用NPCのw.treeIdx/w.pos/w.arrivedと同じ考え方)
      harvest: { level:0, boxWood:0, machines:[] },
      trade:   { level:0, boxGold:0 }
    },
    automationLastTick: Date.now()
  };
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed || parsed.v !== GAME_VERSION) return defaultState();
    // 旧セーブ互換: 新フィールドが無ければ補う
    if(!parsed.player) parsed.player = { x: PLAYER_SPAWN.x, z: PLAYER_SPAWN.z, carryWood:6 };
    if(!parsed.resources) parsed.resources = { wood:0, food:0, gold:0 };
    if(!parsed.harvestWorkers) parsed.harvestWorkers = [];
    if(!parsed.sellWorkers) parsed.sellWorkers = [];
    if(!parsed.hiredLastTick) parsed.hiredLastTick = Date.now();
    if(!parsed.upgrades) parsed.upgrades = { amount:0, speed:0, price:0 };
    if(!parsed.automation) parsed.automation = { harvest:{level:0,boxWood:0}, trade:{level:0,boxGold:0} };
    if(!parsed.automation.harvest) parsed.automation.harvest = { level:0, boxWood:0 };
    // 旧セーブ(v0.12.0=マシン1台固定・単一のtreeIdx/pos等を直接保持)からの互換:
    // レベル(旧・速度レベル)の数だけマシン台数を用意する
    if(!parsed.automation.harvest.machines){
      const lv = parsed.automation.harvest.level || 0;
      parsed.automation.harvest.machines = [];
      for(let i=0;i<lv;i++){
        parsed.automation.harvest.machines.push({ treeIdx:null, pos:null, progress:0, arrived:false, stepTimer:0 });
      }
      delete parsed.automation.harvest.treeIdx; delete parsed.automation.harvest.pos;
      delete parsed.automation.harvest.progress; delete parsed.automation.harvest.arrived;
      delete parsed.automation.harvest.stepTimer;
    }
    parsed.automation.harvest.machines.forEach(m=>{
      if(m.treeIdx === undefined) m.treeIdx = null;
      if(m.pos === undefined) m.pos = null;
      if(m.progress === undefined) m.progress = 0;
      if(m.arrived === undefined) m.arrived = false;
      if(m.stepTimer === undefined) m.stepTimer = 0;
    });
    if(!parsed.automation.trade) parsed.automation.trade = { level:0, boxGold:0 };
    if(!parsed.automationLastTick) parsed.automationLastTick = Date.now();
    delete parsed.hiredJob; delete parsed.boxWood; delete parsed.autoSell; delete parsed.player.map; // 旧仕様の名残を掃除(拠点と森を1枚のマップに統合)
    // 座標はグリッド(整数)前提のため、旧セーブの端数座標は最寄りマスへ丸める
    parsed.player.x = Math.round(parsed.player.x);
    parsed.player.z = Math.round(parsed.player.z);
    // 拠点のレイアウト変更(例: v0.15.0での拠点幅の修正)により、旧セーブの座標が現在は通行不可能な
    // マス(客待機エリア等)になっていることがある。そのままだと1マスずつしか動けない仕様上、
    // 拠点内へ戻れず操作不能になってしまうため、現在地が通行不可能なら初期位置へ戻す
    if(blocked(parsed.player.x, parsed.player.z)){
      parsed.player.x = PLAYER_SPAWN.x;
      parsed.player.z = PLAYER_SPAWN.z;
    }
    return parsed;
  }catch(e){
    return defaultState();
  }
}
function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){ /* storage disabled (private mode / data: url) - ignore */ }
}
function storageCap(){ return STORAGE_CAP; }

/* =========================================================
   アクション(市場タブでの資源売買)
   ========================================================= */
function sell(resKey, amount){
  const rate = MARKET_RATES[resKey].sell;
  amount = Math.min(amount, Math.floor(state.resources[resKey]));
  if(amount <= 0) return;
  state.resources[resKey] -= amount;
  state.resources.gold += Math.round(amount * rate);
  render(); save();
}
function buy(resKey, amount){
  const rate = MARKET_RATES[resKey].buy;
  const cost = Math.ceil(amount * rate);
  if(state.resources.gold < cost) { toast("ゴールドが足りない"); return; }
  const cap = storageCap();
  const room = cap - state.resources[resKey];
  if(room <= 0){ toast("倉庫が満杯"); return; }
  const actualAmount = Math.min(amount, room);
  const actualCost = Math.ceil(actualAmount * rate);
  state.resources.gold -= actualCost;
  state.resources[resKey] += actualAmount;
  render(); save();
}

const MARKET_RATES = {
  wood: { sell:0.28, buy:0.55 },
  food: { sell:0.35, buy:0.65 }
};

/* =========================================================
   拠点マップ(3D ワールド)
   ========================================================= */
// マップ寸法・配置(ワールド座標。TILE=1なので1ユニット=1マス)
// v0.9.0: 拠点ゾーンを7x7に拡大。木材売買カウンターは西側に設置(初期のレイアウトに近い形)。
// 木材伐採エリア(森)は扉の先に直結する連続マップ。
const TILE = 1;                         // 1マスのサイズ
// 拠点ゾーンはx(東西)とz(南北)で別の範囲を持つ長方形(以前はBASE_MIN/BASE_MAXの1組をxにもzにも
// 使い回していたため、北へ拡張した際に拠点が意図せず正方形になり、床(buildGround)の中心もずれる
// 不具合が起きていた。東西幅7マスはそのまま、南北だけ拡張できるよう軸ごとに分離する)
const BASE_MIN_X = -3, BASE_MAX_X = 3;  // 拠点ゾーンの東西範囲(7マス、変更なし)

const AUTOMATION_UNLOCK_COST = 500;     // 初回導入(Lv.0→1)に必要なゴールド
const AUTOMATION_MAX = 5;               // 自動化の最大レベル
// 伐採マシン: 実際に木まで歩いて1本を仕上げる方式。1台あたりの伐採速度は常に一定で、
// レベルアップでは速度を上げず、稼働台数を1台ずつ増やす(1レベル=1台。台数が増えるぶん全体の生産量が伸びる)
// (収穫量は通常の伐採と同じ木を伐るのでwoodPerTree()をそのまま使う)
const AUTOMATION_HARVEST_SECONDS = 6;   // マシン1台が木1本を仕上げるのにかかる秒数(固定)
const AUTOMATION_SELL_RATE = 2;         // 常駐売買NPC1体あたりの受け渡し速度(個/秒、固定。伐採マシンと同様、
                                         // レベルアップは速度ではなく台数(=客NPCの列の本数)を増やす方式
function automationCost(kind){ // レベルアップのコストは大幅に高騰させる(導入時はAUTOMATION_UNLOCK_COST固定)
  const lv = state.automation[kind].level;
  if(lv >= AUTOMATION_MAX) return null;
  if(lv === 0) return AUTOMATION_UNLOCK_COST;
  return Math.round(AUTOMATION_UNLOCK_COST * Math.pow(2.2, lv));
}

// 拠点ゾーン・扉・森ゾーンを1つの連続したマップとして判定する。
// NPCエリア・効率化エリアは床のみ(通行可)、木もすり抜けられるので、境界の判定だけでよい
function blocked(x,z){
  if(z >= BASE_MIN_Z && z <= BASE_MAX_Z) return x < BASE_MIN_X || x > BASE_MAX_X; // 拠点ゾーン(西端=木材売買カウンター)
  if(z === DOOR_Z) return !inDoorGap(x); // 門(扉の幅だけ通れる)
  if(z >= FOREST_MIN_Z && z <= FOREST_MAX_Z) return x < FOREST_MIN_X || x > FOREST_MAX_X; // 森ゾーン(客待機エリアまで拡張した横幅)
  return true; // 範囲外
}

function addBox(group, mat, x,y,z, sx,sy,sz){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mat);
  mesh.position.set(x,y,z);
  group.add(mesh);
  return mesh;
}
function addPad(group, x,z,color){
  const mesh = new THREE.Mesh(new THREE.CircleGeometry(0.6,24), new THREE.MeshStandardMaterial({ color }));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0.03, z);
  group.add(mesh);
}
function buildGround(group){
  const baseWidth = (BASE_MAX_X - BASE_MIN_X + 1) + 1;      // 壁-壁の幅(拠点)
  const forestWidth = (FOREST_MAX_X - FOREST_MIN_X + 1) + 1; // 壁-壁の幅(森。客待機エリアまで拡張)
  const forestCx = (FOREST_MIN_X + FOREST_MAX_X) / 2;
  const baseZLen = (BASE_MAX_Z - BASE_MIN_Z + 1) + 1;
  // 拠点は東西幅と南北深さが異なる(非対称)ため、中心を(0,0)固定にせずBASE_MIN_X/Z・BASE_MAX_X/Zから
  // 都度計算する(固定値0のままだと北へ拡張したぶん床と柵の位置がずれる不具合の原因になっていた)
  const baseCx = (BASE_MIN_X + BASE_MAX_X) / 2, baseCz = (BASE_MIN_Z + BASE_MAX_Z) / 2;
  const forestZLen = (FOREST_MAX_Z+1) - DOOR_Z;
  addBox(group, new THREE.MeshStandardMaterial({color:0x6b9c48}), baseCx,-0.1,baseCz, baseWidth, 0.2, baseZLen); // 拠点ゾーンの地面(草)
  addBox(group, new THREE.MeshStandardMaterial({color:0x3f5e2f}), forestCx,-0.1,(DOOR_Z+FOREST_MAX_Z+1)/2, forestWidth, 0.2, forestZLen); // 森ゾーンの地面
  const plazaCx = (PLAZA_MIN_X+PLAZA_MAX_X)/2, plazaCz = (PLAZA_MIN_Z+PLAZA_MAX_Z)/2;
  const plazaDepth = (PLAZA_MAX_Z - PLAZA_MIN_Z + 1) + 1; // 縦方向は拠点と同じ幅まで拡張済み
  addBox(group, new THREE.MeshStandardMaterial({color:0x8a6f4a}), plazaCx,-0.1,plazaCz, 7, 0.2, plazaDepth); // 客NPC待機エリアの地面(土の広場)
}
// 拠点(幅7)と森(客待機エリアまで拡張した幅)は横幅が異なるため、東西の柵は扉の行(DOOR_Z)を境に
// 幅が切り替わる2段構成にする(扉の行そのものは森側の幅いっぱいに、扉の隙間だけ開ける)
function buildFence(group){
  const mat = new THREE.MeshStandardMaterial({ color:0x8a6b3f });
  const postMat = new THREE.MeshStandardMaterial({ color:0x5a4128 });
  const baseWidth = (BASE_MAX_X - BASE_MIN_X + 1);
  const forestWidth = (FOREST_MAX_X - FOREST_MIN_X + 1);
  addBox(group, mat, 0, 0.8, BASE_MIN_Z-1, baseWidth, 1.6, 0.4);              // 北(拠点)
  // 東: 拠点部分(拠点幅、扉の行まで)+ 森部分(森幅、扉の行から南)
  const baseEastZLen = DOOR_Z - (BASE_MIN_Z-1);
  addBox(group, mat, BASE_MAX_X+1, 0.8, ((BASE_MIN_Z-1)+DOOR_Z)/2, 0.4, 1.6, baseEastZLen);
  const forestSideZLen = (FOREST_MAX_Z+1) - DOOR_Z;
  addBox(group, mat, FOREST_MAX_X+1, 0.8, (DOOR_Z+(FOREST_MAX_Z+1))/2, 0.4, 1.6, forestSideZLen);
  // 西: 上下1マスずつだけ壁を残し、それ以外の全長(COUNTER_Z_FROM〜COUNTER_Z_TO)はカウンター本体で塞ぐ
  // + 森部分(森幅、扉の行から南)
  addBox(group, mat, BASE_MIN_X-1, 0.8, BASE_MIN_Z, 0.4, 1.6, 1);           // 上端の壁(1マス)
  const westSouthLen = DOOR_Z - (BASE_MAX_Z-0.5);
  addBox(group, mat, BASE_MIN_X-1, 0.8, (BASE_MAX_Z-0.5+DOOR_Z)/2, 0.4, 1.6, westSouthLen); // 下端の壁(1マス)+扉の行までの接続
  addBox(group, mat, FOREST_MIN_X-1, 0.8, (DOOR_Z+(FOREST_MAX_Z+1))/2, 0.4, 1.6, forestSideZLen);
  // 門の行(森幅いっぱいに、扉の隙間だけ開ける)
  const doorLeftW = DOOR_FROM - (FOREST_MIN_X-1), doorRightW = (FOREST_MAX_X+1) - DOOR_TO;
  addBox(group, mat, ((FOREST_MIN_X-1)+DOOR_FROM)/2, 0.8, DOOR_Z, doorLeftW, 1.6, 0.4);   // 門の行・西側
  addBox(group, mat, (DOOR_TO+(FOREST_MAX_X+1))/2, 0.8, DOOR_Z, doorRightW, 1.6, 0.4);    // 門の行・東側
  addBox(group, mat, (FOREST_MIN_X+FOREST_MAX_X)/2, 0.8, FOREST_MAX_Z+1, forestWidth, 1.6, 0.4); // 南(森)
  addBox(group, postMat, DOOR_FROM, 1.1, DOOR_Z, 0.3, 2.2, 0.3);      // 門柱
  addBox(group, postMat, DOOR_TO, 1.1, DOOR_Z, 0.3, 2.2, 0.3);
}
function buildDoorPair(group){
  // 扉(観音開き)。プレイヤーが近づくと自動で開き、離れると閉じる(演出のみ、移動はブロックしない)
  const mat = new THREE.MeshStandardMaterial({ color:0x6b4a2b });
  const halfW = (DOOR_TO - DOOR_FROM) / 2;
  const leftPivot = new THREE.Group(); leftPivot.position.set(DOOR_FROM, 0, DOOR_Z);
  const leftPanel = new THREE.Mesh(new THREE.BoxGeometry(halfW, 1.7, 0.12), mat);
  leftPanel.position.set(halfW/2, 0.95, 0);
  leftPivot.add(leftPanel);
  const rightPivot = new THREE.Group(); rightPivot.position.set(DOOR_TO, 0, DOOR_Z);
  const rightPanel = new THREE.Mesh(new THREE.BoxGeometry(halfW, 1.7, 0.12), mat);
  rightPanel.position.set(-halfW/2, 0.95, 0);
  rightPivot.add(rightPanel);
  group.add(leftPivot, rightPivot);
  return { leftPivot, rightPivot };
}
function setDoorSwing(door, p){

function sellWorkerVisualPos(i){
  const angle = (i / WORKER_MAX) * Math.PI * 2;
  return { x: TRADE_PT.x + Math.cos(angle)*0.55, z: TRADE_PT.z + Math.sin(angle)*0.55 };

// 伐採NPCを1マスずつ担当の木へ歩かせる(毎フレーム呼び出す)
function updateHarvestWorkersWalk(dt){
  for(const w of state.harvestWorkers){
    if(w.treeIdx == null || !w.pos) continue;
    const t = trees[w.treeIdx];
    if(w.pos.x === t.x && w.pos.z === t.z){ w.arrived = true; continue; }
    w.arrived = false;
    w.stepTimer = (w.stepTimer||0) - dt;
    if(w.stepTimer <= 0){
      if(w.pos.x !== t.x) w.pos.x += Math.sign(t.x - w.pos.x);
      else if(w.pos.z !== t.z) w.pos.z += Math.sign(t.z - w.pos.z);
      w.stepTimer = WORKER_STEP_DURATION;
    }
  }
}
// 伐採NPCのメッシュの位置・伐採エフェクトの見た目を毎フレーム更新する
function updateHarvestWorkerVisuals(){
  if(!world || !world.harvestWorkerMeshes) return;
  const now = performance.now();
  state.harvestWorkers.forEach((w,i)=>{
    const m = world.harvestWorkerMeshes[i];
    if(!m) return;
    const pos = harvestWorkerVisualPos(w);
    m.position.set(pos.x, 0, pos.z);
    const eff = m.getObjectByName("effect");
    if(eff){

}
function buildEfficiencyArea(group){

// 丸太3本を束ねた「1セット」の見た目(木材3個=1セットとして積む)
function buildLogBundle(mat){
  const g = new THREE.Group();
  const offsets = [[-0.1,0],[0.1,0],[0,0.1]];
  for(const [ox,oy] of offsets){
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.4,8), mat);
    log.rotation.z = Math.PI/2;
    log.position.set(ox,oy,0);
    g.add(log);
  }
  return g;
}
function buildLogPileAt(group, cx, cz, baseY, count){
  // 積まれた木材の山(見た目のみ)。3本束ねた「1セット」をあらかじめ用意し非表示にしておき、
  // セット数(木材数/PILE_UNIT)に応じて表示数を切り替える
  const mat = new THREE.MeshStandardMaterial({ color:0xc98a4b });
  const bundles = [];
  const perRow = 3;
  for(let i=0; i<count; i++){
    const row = Math.floor(i/perRow), col = i%perRow;
    const bundle = buildLogBundle(mat);
    bundle.position.set(cx-0.3+col*0.3, baseY+row*0.24, cz);
    bundle.visible = false;
    group.add(bundle);
    bundles.push(bundle);
  }
  return bundles;
}
function buildWoodCounter(group){
  // 木材売買カウンター(拠点の西側の壁、上下1マスを除く全長=COUNTER_Z_FROM〜COUNTER_Z_TO)。
  // 内側(拠点)にプレイヤー用の置き場・売買ポイント(レーン0)、外側(客NPC待機エリア)から
  // 客NPCがアクセスするドライブスルー形式。レーン1以降(自動化NPC用)は導入されたぶんだけ稼働する
  const cz = (COUNTER_Z_FROM + COUNTER_Z_TO) / 2;
  const clen = (COUNTER_Z_TO - COUNTER_Z_FROM + 1) + 0.2;
  addBox(group, new THREE.MeshStandardMaterial({color:0x7a5a34}), WOOD_COUNTER_X, 0.5, cz, 1.0, 1.0, clen);   // カウンター本体
  addBox(group, new THREE.MeshStandardMaterial({color:0x5c4326}), WOOD_COUNTER_X, 1.05, cz, 1.2, 0.15, clen+0.2); // 天板
  addPad(group, DEPOSIT_PT.x, DEPOSIT_PT.z, 0xc98a4b); // 木材を置くポイント
  addPad(group, TRADE_PT.x, TRADE_PT.z, 0xf0c245);     // 売買するポイント(レーン0)
  return buildLogPileAt(group, WOOD_COUNTER_X, DEPOSIT_PT.z, 1.28, 10);
}
// 木の造形: 旧デザインは葉(コーン)の下端(y=0.8)がプレイヤー/NPCの頭部(y〜0.9〜1.5)と近距離で
// 重なり、深度バッファの奪い合い(z-fighting)で一時的に消えて見えることがあった。
// 葉を複数の塊に分けてプレイヤー/NPCの背丈より高い位置にまとめ、干渉自体を避ける。
// 保険として、重なりが生じても目立ちにくいようpolygonOffsetも付与する
function buildTreeMesh(t){
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x6b4a2b, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.24,1.3,8), trunkMat);
  trunk.position.y = 0.65; trunk.name = "trunk";
  const leafMat = new THREE.MeshStandardMaterial({ color:0x3f7d3a, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
  const leaves = new THREE.Group(); leaves.name = "leaves";
  const clusterGeo = new THREE.IcosahedronGeometry(0.6, 0);
  const clusters = [ // [x,y,z,scale] プレイヤー頭部(最大y≈1.5)より高いy=1.9以上にまとめて配置
    [0, 2.5, 0, 1.0], [0.32, 2.15, 0.18, 0.72], [-0.3, 2.1, -0.22, 0.72],
    [0.05, 1.9, 0.35, 0.66], [-0.25, 1.95, -0.3, 0.6]
  ];
  for(const [cx,cy,cz,scale] of clusters){
    const m = new THREE.Mesh(clusterGeo, leafMat);
    m.position.set(cx,cy,cz);
    m.scale.setScalar(scale);
    leaves.add(m);
  }
  g.add(trunk, leaves);
  // 伐採エフェクト: 落ち葉パーティクル(プレイヤー・NPC・自動マシンいずれの伐採中も、対象の木に表示)
  // 初期状態は非表示。userData.isLeafで判別し、毎フレームupdateTreeLeafEffects()が位置と表示を更新する
  const fallMat = new THREE.MeshStandardMaterial({ color:0x5a9c3f, side: THREE.DoubleSide });
  for(let i=0;i<5;i++){
    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.16,0.16), fallMat);
    leaf.visible = false;
    leaf.userData.isLeaf = true;
    leaf.userData.seed = i*1.7;
    leaf.userData.speed = 0.6 + (i%3)*0.15;
    leaf.userData.radius = 0.3 + (i%3)*0.15;
    leaf.userData.baseY = 2.2 + (i%2)*0.3;
    g.add(leaf);
  }
  g.position.set(t.x, 0, t.z);
  return g;
}
function setTreeVisual(t){
  if(!t.mesh) return;
  const trunk = t.mesh.getObjectByName("trunk"), leaves = t.mesh.getObjectByName("leaves");
  if(t.state === "tree"){ trunk.scale.set(1,1,1); trunk.position.y = 0.65; leaves.visible = true; }
  else { trunk.scale.set(1,0.25,1); trunk.position.y = 0.16; leaves.visible = false; }
}
// 指定した木が(プレイヤー手動・伐採NPC・伐採マシン問わず)現在伐採中かどうか
function isTreeBeingHarvested(idx){
  if(idx === harvestingTreeIdx) return true;
  if(state.harvestWorkers.some(w => w.treeIdx === idx && w.arrived)) return true;
  return state.automation.harvest.machines.some(m => m.treeIdx === idx && m.arrived);
}
// 伐採中の木だけ、落ち葉パーティクルを円を描きながら舞い落とす(毎フレーム呼び出す)
function updateTreeLeafEffects(now){
  for(let i=0;i<trees.length;i++){
    const t = trees[i];
    if(!t.mesh) continue;
    const active = t.state === "tree" && isTreeBeingHarvested(i);
    for(const child of t.mesh.children){
      if(!child.userData || !child.userData.isLeaf) continue;
      child.visible = active;
      if(!active) continue;
      const ud = child.userData;
      const cycle = 1.7;
      const tSec = now/1000;
      const p = (((tSec * ud.speed) + ud.seed) % cycle) / cycle; // 0→1の落下進行度(ループ)
      const ang = ud.seed + tSec*ud.speed*2;
      child.position.set(Math.cos(ang)*ud.radius, ud.baseY - p*2.0, Math.sin(ang)*ud.radius);
      child.rotation.set(ang*1.3, 0, ang*2);
    }
  }
}

// 現在アクティブな売買レーン数(0=プレイヤー用は常時、1以降は売買自動化のレベル分だけ開放)
function activeLaneCount(){ return 1 + state.automation.trade.level; }
// 取引完了後の客NPCの退場アニメーション(毎フレーム呼び出す)。
// まず右(奥)へ1マス横移動(sidestep)してから、列の後方側(西、PLAZA_MIN_X方向)へ1マスずつ歩き(walk)、
// 待機エリア外(PLAZA_MIN_Xより西)に出たタイミングで消滅させる
function updateExitingNpcs(dt){
  for(let i = exitingNpcs.length-1; i >= 0; i--){
    const npc = exitingNpcs[i];
    npc.stepTimer = (npc.stepTimer||0) - dt;
    if(npc.stepTimer > 0) continue;
    npc.stepTimer = WORKER_STEP_DURATION;
    if(npc.exitPhase === "sidestep"){
      if(npc.pos.z < npc.exitTargetZ) npc.pos.z += 1;
      else npc.exitPhase = "walk";
    } else {
      npc.pos.x -= 1;
      if(npc.pos.x < PLAZA_MIN_X){
        if(npc.mesh && world) world.group.remove(npc.mesh);
        exitingNpcs.splice(i,1);
        continue;
      }
    }
    if(npc.mesh) npc.mesh.position.set(npc.pos.x, 0, npc.pos.z);
  }
}
// target: "player"(既定、代金を即ゴールドへ) | "box"(売買自動化用。代金は収集ボックスへ貯める)
function completeFrontNpcPurchase(laneIdx, target){
  const npc = npcQueues[laneIdx].shift();
  if(npc){
    // 取引完了後もすぐには消さず、退場アニメーションへ切り替える(右へ1マス→列の後方側へ1マスずつ、
    // 待機エリア外に出たら消滅)。先頭にいた座標からスタート。レーン間隔(TRADE_LANE_GAP=2マス)の
    // ちょうど中間に入るので、隣のレーンの列と重ならずに退場できる
    const frontPos = npcSlotPos(laneIdx, 0);
    npc.pos = { x: frontPos.x, z: frontPos.z };
    npc.exitTargetZ = frontPos.z + 1;
    npc.exitPhase = "sidestep";
    npc.stepTimer = 0;
    exitingNpcs.push(npc);
  }
  const reward = tradeRewardGold();
  if(target === "box"){
    state.automation.trade.boxGold += reward; // 現地(常駐NPCのそば)で回収するまで蓄積、トーストは出さない
  } else {
    state.resources.gold += reward;
    toast(`🤝 取引成立!+${reward}G`);
  }
  ensureQueueFilled(laneIdx);
  repositionNpcQueue(laneIdx);
}
// 在庫と列を使って、渡された量(端数可)ぶん取引を進める。実際に処理できた量を返す
// (手動での売買ポイント滞在・雇用NPCによる自動売買・売買自動化NPCの3者から共通で呼び出す。laneIdxで
// どの売買レーンの列を消化するか指定する)
function processTradeUnits(laneIdx, amount, target){
  let remain = amount;
  let used = 0;
  const queue = npcQueues[laneIdx];
  while(remain > 1e-9 && queue.length > 0 && state.resources.wood > 1e-9){
    const front = queue[0];
    const room = NPC_BUY_ORDER - front.bought;
    const take = Math.min(remain, room, state.resources.wood);
    if(take <= 1e-9) break;
    state.resources.wood -= take;
    front.bought += take;
    remain -= take;
    used += take;
    if(front.bought >= NPC_BUY_ORDER - 1e-9) completeFrontNpcPurchase(laneIdx, target);
  }
  return used;
}

// 自動化の導入状況(state.automation)に合わせて、機械・常駐NPC・収集ボックスの表示を同期する
function syncAutomationMeshes(){
  if(!world) return;
  const machines = state.automation.harvest.machines;
  if(!world.autoHarvestMeshes) world.autoHarvestMeshes = [];
  // 伐採マシンは台数ぶんメッシュを用意する(不足分を追加、レベルダウン時は余剰分を削除)
  while(world.autoHarvestMeshes.length < machines.length){
    const m = buildAutomationHarvestMesh();
    world.group.add(m);
    world.autoHarvestMeshes.push(m);
  }
  while(world.autoHarvestMeshes.length > machines.length){
    world.group.remove(world.autoHarvestMeshes.pop());
  }
  if(machines.length > 0 && !world.autoWoodBoxMesh){
    world.autoWoodBoxMesh = buildAutomationWoodBoxMesh();
    world.group.add(world.autoWoodBoxMesh);
  } else if(machines.length === 0 && world.autoWoodBoxMesh){
    world.group.remove(world.autoWoodBoxMesh);
    world.autoWoodBoxMesh = null;
  }
  const tLv = state.automation.trade.level;
  if(tLv > 0 && !world.autoGoldBoxMesh){
    world.autoGoldBoxMesh = buildAutomationGoldBoxMesh();
    world.group.add(world.autoGoldBoxMesh);
  } else if(tLv <= 0 && world.autoGoldBoxMesh){
    world.group.remove(world.autoGoldBoxMesh);
    world.autoGoldBoxMesh = null;
  }
  syncTradeLanes();
}
// 売買自動化のレベル(=開放されたレーン数)に合わせて、レーン1以降の常駐NPC・客NPCの列を同期する
// (レーン0=プレイヤー用は別枠で常時有効なのでここでは扱わない)
function syncTradeLanes(){
  if(!world) return;
  if(!world.tradeNpcMeshes) world.tradeNpcMeshes = [];
  const active = activeLaneCount();
  for(let i=1; i<TRADE_LANE_MAX; i++){
    const shouldBeActive = i < active;
    if(shouldBeActive && !world.tradeNpcMeshes[i]){
      const m = buildAutomationTradeNpcMesh(i);
      world.group.add(m);
      world.tradeNpcMeshes[i] = m;
      ensureQueueFilled(i);
    } else if(!shouldBeActive && world.tradeNpcMeshes[i]){
      world.group.remove(world.tradeNpcMeshes[i]);
      world.tradeNpcMeshes[i] = null;
      npcQueues[i].forEach(npc=> world.group.remove(npc.mesh)); // 開放されなくなったレーンの客NPCも消す
      npcQueues[i] = [];
    }
  }
}

    }
  });
}

function worldToScreen(x,y,z){
  const v = new THREE.Vector3(x,y,z).project(world.camera);
  const rect = world.wrap.getBoundingClientRect();
  return { x:(v.x*0.5+0.5)*rect.width, y:(-v.y*0.5+0.5)*rect.height, behind: v.z>1 };
}

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c1a10);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 150); // FOVを広げ、見える範囲を拡大
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(6,10,4);
  scene.add(sun);

  const group = new THREE.Group();
  buildGround(group);
  buildFence(group);
  const pileLogs = buildWoodCounter(group);
  buildEfficiencyArea(group);
  buildNpcArea(group);
  const door = buildDoorPair(group);
  for(const t of trees){ t.mesh = buildTreeMesh(t); group.add(t.mesh); }
  scene.add(group);

  const playerMesh = buildPlayerMesh();
  scene.add(playerMesh);

  world = { renderer, scene, camera, wrap, group, playerMesh, pileLogs, door };
  resizeScene();
  window.addEventListener("resize", resizeScene);
  updatePlayerMesh();
  ensureQueueFilled(0); // レーン0(プレイヤー用)は常時有効。レーン1以降はsyncAutomationMeshes()内のsyncTradeLanes()が担当
  updateWoodPile();
  syncWorkerMeshes();
  syncAutomationMeshes();
  requestAnimationFrame(animate);
}
function resizeScene(){
  if(!world) return;
  const w = world.wrap.clientWidth, h = world.wrap.clientHeight;
  if(w<=0||h<=0) return;
  world.renderer.setSize(w, h, false);
  world.camera.aspect = w/h;
  world.camera.updateProjectionMatrix();
}
function updatePlayerMesh(){
  if(!world) return;
  world.playerMesh.position.set(state.player.x, 0, state.player.z);
  // カメラをプレイヤーの南西側・上方に配置し、斜め上から見下ろす3/4視点にする
  // (高さに対して水平距離を大きくするほど見下ろし角度が水平に近づく=視点が「起きる」)
  world.camera.position.set(state.player.x - 11.0, 6.0, state.player.z + 11.0);
  world.camera.lookAt(state.player.x, 0, state.player.z);
}

// --- 扉の開閉演出 ---------------------------------------------------------
// マップ切替は行わない(1枚の連続マップ)ため、扉はプレイヤーが近づくと自動で開き、
// 離れると閉じるだけの見た目の演出。移動そのものをブロックすることはない。
function updateDoorSwing(dt){
  if(!world || !world.door) return;
  const p = state.player;
  const near = Math.abs(p.z - DOOR_Z) <= 1.5 && p.x >= DOOR_FROM-1.5 && p.x <= DOOR_TO+1.5;
  const target = near ? 1 : 0;
  const rate = dt/0.3;
  if(doorSwing < target) doorSwing = Math.min(target, doorSwing+rate);
  else if(doorSwing > target) doorSwing = Math.max(target, doorSwing-rate);
  setDoorSwing(world.door, doorSwing);
}

// --- 移動(1マスずつ) --------------------------------------------------
function beginStep(nx,nz){
  stepping = true;
  stepFrom = { x: state.player.x, z: state.player.z };
  stepTo = { x: nx, z: nz };
  stepT = 0;
}
function attemptStep(dir){
  if(stepping) return;
  let dx=0, dz=0;
  if(dir==="up") dz=-1; else if(dir==="down") dz=1;
  else if(dir==="left") dx=-1; else if(dir==="right") dx=1;
  if(!dx && !dz) return;
  const p = state.player;
  const nx = p.x+dx, nz = p.z+dz;
  if(blocked(nx,nz)) return;
  beginStep(nx,nz);
}
function updateStepping(dt){
  if(!stepping) return;
  stepT += dt/STEP_DURATION;
  const t = Math.min(1, stepT);
  state.player.x = stepFrom.x + (stepTo.x-stepFrom.x)*t;
  state.player.z = stepFrom.z + (stepTo.z-stepFrom.z)*t;
  if(t >= 1){
    stepping = false;
    state.player.x = stepTo.x; state.player.z = stepTo.z;
    save();
  }
}

// --- 拠点と森を1枚のマップとして扱う操作判定 ------------------------------
function updateInteractions(dt){
  const p = state.player;
  let actionShown = false;

  // 森ゾーン: 木の伐採(近くの木がなければ何も起きない)
  let nearIdx = -1;
  for(let i=0;i<trees.length;i++){
    if(trees[i].state === "tree" && distTo(trees[i].x,trees[i].z,p.x,p.z) <= HARVEST_RADIUS){ nearIdx = i; break; }
  }
  const need = harvestSeconds();
  if(nearIdx >= 0){
    const t = trees[nearIdx];
    t.progress += dt;
    harvestingTreeIdx = nearIdx;
    if(t.progress >= need){
      t.state = "stump"; t.progress = 0; t.stumpUntil = Date.now() + REGROW_SECONDS*1000;
      setTreeVisual(t);
      const gained = woodPerTree();
      p.carryWood = Math.min(CARRY_CAP, p.carryWood + gained);
      toast(`🪓 木材を${gained}手に入れた!`);
      updateHud(); save();
      harvestingTreeIdx = -1;
    } else {
      const pct = Math.min(100, Math.round(t.progress/need*100));
      showAction(`🪓 伐採中… ${pct}%`);
      actionShown = true;
    }
  } else {
    for(const t of trees) if(t.state === "tree") t.progress = 0;
    harvestingTreeIdx = -1;
  }
  const now = Date.now();
  for(const t of trees){
    if(t.state === "stump" && now >= t.stumpUntil){ t.state = "tree"; setTreeVisual(t); }
  }

  // 拠点ゾーン: 置き場(運搬中の木材をカウンターに積む。見た目にも山として積まれる)
  if(p.carryWood > 0 && distTo(DEPOSIT_PT.x,DEPOSIT_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    const room = Math.max(0, storageCap() - state.resources.wood);
    const move = Math.min(p.carryWood, room);
    if(move > 0){
      state.resources.wood += move; p.carryWood -= move;
      renderResBar(); updateHud(); updateWoodPile(); save();
      toast(`📦 木材${move}をカウンターに置いた`);
    } else {
      toast("カウンターがいっぱいで置けない");
    }
  }

  // 拠点ゾーン: 売買ポイント(レーン0=プレイヤー用。先頭のNPCに木材を渡し続け、3個で1回の取引が成立)
  if(distTo(TRADE_PT.x,TRADE_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    ensureQueueFilled(0);
    if(state.resources.wood > 0 && npcQueues[0].length > 0){
      const used = processTradeUnits(0, WOOD_TRANSFER_PER_SEC*dt);
      if(used > 0){ renderResBar(); updateWoodPile(); save(); }
      const front = npcQueues[0][0];
      showAction(front ? `💰 お客さんへ渡し中… ${Math.floor(front.bought)}/${NPC_BUY_ORDER}` : "お客さんを待っています…");
    } else if(npcQueues[0].length === 0){
      showAction("お客さんを待っています…");
    } else {
      showAction("木材の在庫がありません");
    }
    actionShown = true;
  }

  // 伐採自動化: 木材収集ボックス(拠点)に近づくと、貯まっている木材をカウンターの在庫へ自動回収する
  if(state.automation.harvest.level > 0 && state.automation.harvest.boxWood > 1e-9 &&
     distTo(AUTO_BOX_WOOD_PT.x,AUTO_BOX_WOOD_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    const room = Math.max(0, storageCap() - state.resources.wood);
    const take = Math.min(state.automation.harvest.boxWood, room);
    if(take > 1e-9){
      state.resources.wood += take;
      state.automation.harvest.boxWood -= take;
      renderResBar(); updateWoodPile(); save();
      toast(`📦 木材収集ボックスから木材${Math.floor(take)}を回収!`);
    }
  }
  // 売買自動化: G収集ボックス(拠点)に近づくと、貯まっているゴールドを自動回収する
  if(state.automation.trade.level > 0 && state.automation.trade.boxGold > 1e-9 &&
     distTo(AUTO_BOX_GOLD_PT.x,AUTO_BOX_GOLD_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    const take = state.automation.trade.boxGold;
    state.resources.gold += take;
    state.automation.trade.boxGold = 0;
    renderResBar(); save();
    toast(`📦 G収集ボックスからゴールド${Math.floor(take)}を回収!`);
  }

  if(!actionShown) hideAction();
}

// --- NPCの雇用(拠点のNPCカウンター、伐採NPC・売買NPCを統一) -------------------
// 雇うとNPCが1体列に並び、仕事量(HIRE_YIELD)を消化するまで働き続けて、消化しきると列から消える
// 伐採NPCは他のNPCが使っていない木を1本担当として割り当てる(木9本・上限5体なので必ず空きがある)
function assignTreeToWorker(w){
  const used = new Set(state.harvestWorkers.filter(x=>x!==w && x.treeIdx!=null).map(x=>x.treeIdx));
  state.automation.harvest.machines.forEach(m=>{ if(m.treeIdx!=null) used.add(m.treeIdx); }); // 伐採マシンの担当木も避ける
  for(let i=0;i<trees.length;i++){
    if(!used.has(i)){ w.treeIdx = i; return; }
  }
  w.treeIdx = null;
}
// --- 伐採マシン(全自動化)の木への移動・割り当て --------------------------
// 木には配置順に番号を振ってある(TREE_DEFSの生成順=左上(森の北西端)がNo.1、右へ行くほど+1、
// 次の行に移るとまた左から続く、というtrees配列のインデックス=番号-1)。
// マシンは1本仕上げるたびに「次の番号」へ進み、最後の番号まで行ったら最初の番号に戻って繰り返す。
// 雇用NPCと違い、実際に個々の木を伐る(t.state/t.progressを操作)ため、まだ「tree」状態で、
// かつ他のマシン・雇用NPCが担当中でない木だけを選ぶ
function nextAvailableTreeIdx(fromIdx){
  const n = trees.length;
  const usedByNpc = new Set(state.harvestWorkers.filter(w=>w.treeIdx!=null).map(w=>w.treeIdx));
  const usedByMachine = new Set(state.automation.harvest.machines.filter(x=>x.treeIdx!=null).map(x=>x.treeIdx));
  for(let step=0; step<n; step++){
    const idx = (fromIdx + step) % n;
    if(trees[idx].state === "tree" && !usedByNpc.has(idx) && !usedByMachine.has(idx)) return idx;
  }
  return null; // 空いている木が無い
}
function assignMachineTree(m, fromIdx){
  m.treeIdx = nextAvailableTreeIdx(fromIdx);
  m.progress = 0;
  m.arrived = false;
}
// 割り当て先が無効(未割り当て・すでに伐採済み)になっていたら再割り当てする。冪等なので何度呼んでもよい
function ensureMachineTarget(m){
  if(!m.pos) m.pos = { x: AUTO_HARVEST_PT.x, z: AUTO_HARVEST_PT.z };
  if(m.treeIdx != null && trees[m.treeIdx] && trees[m.treeIdx].state === "tree") return;
  assignMachineTree(m, m.treeIdx != null ? m.treeIdx : 0);
}
// 伐採マシン(台数ぶん)を1マスずつ担当の木へ歩かせる(毎フレーム呼び出す。雇用NPCの歩行と同じ方式)
function updateAutomationHarvestWalk(dt){
  for(const m of state.automation.harvest.machines){
    ensureMachineTarget(m);
    if(m.treeIdx == null) continue; // 空いている木が無い
    const t = trees[m.treeIdx];
    if(m.pos.x === t.x && m.pos.z === t.z){ m.arrived = true; continue; }
    m.arrived = false;
    m.stepTimer = (m.stepTimer||0) - dt;
    if(m.stepTimer <= 0){
      if(m.pos.x !== t.x) m.pos.x += Math.sign(t.x - m.pos.x);
      else if(m.pos.z !== t.z) m.pos.z += Math.sign(t.z - m.pos.z);
      m.stepTimer = WORKER_STEP_DURATION;
    }
  }
}
function hireWorker(kind){
  const arr = kind === "harvest" ? state.harvestWorkers : state.sellWorkers;
  if(arr.length >= WORKER_MAX){ toast(`これ以上雇えない(最大${WORKER_MAX}体)`); return; }
  if(state.resources.gold < HIRE_COST){ toast("ゴールドが足りない"); return; }
  state.resources.gold -= HIRE_COST;
  const w = { remaining: HIRE_YIELD, treeIdx: null };
  if(kind === "harvest"){
    assignTreeToWorker(w);
    w.pos = { x: NPC_COUNTER_PT.x, z: NPC_COUNTER_PT.z }; // NPCエリアから木まで1マスずつ歩く
    w.arrived = false;
  }
  arr.push(w);
  state.hiredLastTick = Date.now();
  syncWorkerMeshes();
  renderResBar(); renderNpcHireList(); save();
  toast(`🪙 ${HIRE_COST}Gで${kind==="harvest"?"伐採":"売買"}NPCを雇った`);
}
// 現実時間ベースで進む(拠点にいない間・オフラインの間も進む)
function processHiredWorkers(now){
  const last = state.hiredLastTick || now;
  const elapsedSec = Math.max(0, (now-last)/1000);
  state.hiredLastTick = now;
  if(elapsedSec <= 0) return;
  let changed = false;
  // 伐採NPC: 担当の木に到着してから、木材をカウンターの在庫(state.resources.wood)へ生産する
  for(let i = state.harvestWorkers.length-1; i >= 0; i--){
    const w = state.harvestWorkers[i];
    // 長時間放置していた場合(オフライン等)は、歩いている途中でも到着済みとみなす
    if(!w.arrived && elapsedSec > 1 && w.treeIdx != null){
      const t = trees[w.treeIdx];
      w.pos = { x: t.x, z: t.z };
      w.arrived = true;
    }
    if(!w.arrived) continue;
    const room = Math.max(0, storageCap() - state.resources.wood);
    const produced = Math.min(elapsedSec*HARVEST_NPC_RATE, w.remaining, room);
    if(produced > 0){ state.resources.wood += produced; w.remaining -= produced; changed = true; }
    if(w.remaining <= 1e-9){ state.harvestWorkers.splice(i,1); changed = true; }
  }
  // 売買NPC(単発雇用、レーン0=プレイヤー用の列で代行): 売買ポイントでの受け渡しを代行
  if(npcQueues[0].length > 0){
    for(let i = state.sellWorkers.length-1; i >= 0; i--){
      const w = state.sellWorkers[i];
      const amount = Math.min(elapsedSec*SELL_NPC_RATE, w.remaining);
      const used = amount > 0 ? processTradeUnits(0, amount) : 0;
      if(used > 0){ w.remaining -= used; changed = true; }
      if(w.remaining <= 1e-9){ state.sellWorkers.splice(i,1); changed = true; }
    }
  }
  if(changed){ renderResBar(); updateWoodPile(); syncWorkerMeshes(); save(); }
}

// --- 全自動化の導入・レベルアップ(効率化エリア) --------------------------
// kind: "harvest"(伐採マシン) | "trade"(常駐売買NPC)。Lv.0→1が導入(500G)、以降はレベルアップ
function buyAutomation(kind){
  const a = state.automation[kind];
  if(a.level >= AUTOMATION_MAX) return;
  const cost = automationCost(kind);
  if(state.resources.gold < cost){ toast("ゴールドが足りない"); return; }
  state.resources.gold -= cost;
  const wasZero = a.level === 0;
  a.level += 1;
  if(kind === "harvest"){
    // 伐採マシンはレベルアップのたびに台数が1台増える(速度は上げない)。新しいマシンは1番の木から順に、
    // 空いている木を探して割り当てる
    const m = { treeIdx:null, pos:null, progress:0, arrived:false, stepTimer:0 };
    assignMachineTree(m, 0);
    a.machines.push(m);
  }
  syncAutomationMeshes();
  renderResBar(); renderEffList(); save();
  if(wasZero){
    toast(kind==="harvest" ? "⚙️ 伐採マシンを森に設置した!" : "⚙️ 売買NPCをカウンターに常駐させた!");
  } else if(kind === "harvest"){
    toast(`⚙️ 伐採マシンを増設した!(計${a.level}台)`);
  } else {
    toast(`⚙️ 常駐売買NPCを増員した!(計${a.level}体・客NPCの列も増設)`);
  }
}
// 現実時間ベースで進む(拠点にいない間・オフラインの間も進む。processHiredWorkersと同じ方式)
function processAutomation(now){
  const last = state.automationLastTick || now;
  const elapsedSec = Math.max(0, (now-last)/1000);
  state.automationLastTick = now;
  if(elapsedSec <= 0) return;
  let changed = false;

  const harvest = state.automation.harvest;
  for(const m of harvest.machines){
    ensureMachineTarget(m);
    // 長時間放置していた場合(オフライン等)は、歩いている途中でも到着済みとみなす(雇用NPCと同じ救済策)
    if(m.treeIdx != null && !m.arrived && elapsedSec > 1){
      const t = trees[m.treeIdx];
      m.pos = { x: t.x, z: t.z };
      m.arrived = true;
    }
    if(m.treeIdx != null && m.arrived){
      const t = trees[m.treeIdx];
      m.progress = (m.progress||0) + elapsedSec;
      if(m.progress >= AUTOMATION_HARVEST_SECONDS){
        const gained = woodPerTree(); // 実際の木を伐るので、通常の伐採と同じ収穫量(効率化の確保量強化も反映)
        const completedIdx = m.treeIdx;
        t.state = "stump"; t.progress = 0; t.stumpUntil = Date.now() + REGROW_SECONDS*1000;
        setTreeVisual(t);
        harvest.boxWood = Math.min(STORAGE_CAP, harvest.boxWood + gained);
        assignMachineTree(m, (completedIdx+1) % trees.length); // 次の番号の木へ(最後まで行ったら1番から)
        changed = true;
      }
    }
  }

  // 売買自動化: レベル分(=開放されたレーン数ぶん)のNPCが、各自の列に対して独立に売買を進める
  // (伐採マシンと同様、レベルアップは速度ではなく台数=レーン数を増やす方式)
  const tLv = state.automation.trade.level;
  if(tLv > 0 && state.resources.wood > 1e-9){
    for(let lane=1; lane<=tLv; lane++){
      if(npcQueues[lane].length === 0) continue;
      const amount = elapsedSec * AUTOMATION_SELL_RATE;
      const used = amount > 0 ? processTradeUnits(lane, amount, "box") : 0;
      if(used > 0) changed = true;
    }
  }
  if(changed){ renderResBar(); updateWoodPile(); save(); }
}

function showAction(text){
  const el = document.getElementById("hudAction");
  el.textContent = text;
  el.classList.add("show");
}
function hideAction(){ document.getElementById("hudAction").classList.remove("show"); }
function currentZoneLabel(){
  const z = state.player.z;
  if(z <= BASE_MAX_Z) return "🏕️ 拠点";
  if(z === DOOR_Z) return "🚪 扉";
  return "🌲 森";
}
function updateHud(){
  document.getElementById("hudMapName").textContent = currentZoneLabel();
  document.getElementById("hudCarry").textContent = `🪵 運搬中: ${state.player.carryWood}`;
}

// 近くにいる時だけ出現する操作ボタン(効率化メニューを開く/NPCを雇う)。エンターキーでも同じ操作ができる
function updateContextButton(){
  const btn = document.getElementById("ctxBtn");
  const p = state.player;
  if(activeModal){ btn.hidden = true; btn.onclick = null; return; }
  if(distTo(EFF_COUNTER_PT.x,EFF_COUNTER_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    btn.hidden = false;
    btn.textContent = "🛠️ 効率化";
    btn.onclick = openEfficiencyModal;
  } else if(distTo(NPC_COUNTER_PT.x,NPC_COUNTER_PT.z,p.x,p.z) <= INTERACT_RADIUS){
    btn.hidden = false;
    btn.textContent = "👷 NPCを雇う";
    btn.onclick = openNpcModal;
  } else {
    btn.hidden = true;
    btn.onclick = null;
  }
}

function animate(ts){
  requestAnimationFrame(animate);
  if(!world) return;
  if(lastFrameTime === null) lastFrameTime = ts;
  const dt = Math.min(0.1, (ts - lastFrameTime)/1000);
  lastFrameTime = ts;

  const baseTabActive = document.getElementById("view-base").classList.contains("active");
  if(stepping){
    updateStepping(dt);
  } else if(heldDir && baseTabActive && !activeModal){
    attemptStep(heldDir);
  }
  updateDoorSwing(dt);
  updateHarvestWorkersWalk(dt);
  updateHarvestWorkerVisuals();
  updateAutomationHarvestWalk(dt);
  updateExitingNpcs(dt);
  processHiredWorkers(Date.now());
  processAutomation(Date.now());
  updateInteractions(dt); // harvestingTreeIdx(手動伐採中の木)をこのフレーム分で確定させてから、葉エフェクトの表示判定に使う
  updateTreeLeafEffects(ts);
  updateAutomationVisuals(ts);
  updateHud();
  updateContextButton();
  updatePlayerMesh();
  updatePointLabels();
  world.renderer.render(world.scene, world.camera);
}

/* =========================================================
   描画
   ========================================================= */
function fmt(n){
  n = Math.floor(n);
  if(n >= 100000) return (n/1000).toFixed(1)+"k";
  return n.toLocaleString("ja-JP");
}
function fmtTime(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if(h>0) return `${h}時間${m}分`;
  if(m>0) return `${m}分${sec}秒`;
  return `${sec}秒`;
}

function renderResBar(){
  const cap = storageCap();
  document.getElementById("resWoodNum").textContent = `${fmt(state.resources.wood)} / ${fmt(cap)}`;
  document.getElementById("resFoodNum").textContent = `${fmt(state.resources.food)} / ${fmt(cap)}`;
  document.getElementById("resGoldNum").textContent = fmt(state.resources.gold);
  document.getElementById("resWoodFill").style.width = Math.min(100, state.resources.wood/cap*100)+"%";
  document.getElementById("resFoodFill").style.width = Math.min(100, state.resources.food/cap*100)+"%";
}

function renderMarket(){
  const wrap = document.getElementById("marketArea");
  wrap.innerHTML = `
    <div class="mcard">

// --- 効率化モーダル(木材の確保量・伐採速度・木材の単価をゴールドで強化) -------
// エリア(効率化カウンター)に来てエンターキーを押すと開く。中では矢印キーで項目を選び、エンターキーで実行できる
function openEfficiencyModal(){
  activeModal = "eff";
  modalSelIndex = 0;
  renderEffList();
  document.getElementById("effModal").hidden = false;
}
function closeEfficiencyModal(){
  activeModal = null;
  document.getElementById("effModal").hidden = true;
}
// 効率化エリア(モーダル)に並ぶ項目: 既存の3強化 + 伐採自動化・売買自動化(500Gで導入する全自動ライン)
const AUTOMATION_DEFS = {
  autoHarvest: { name:"伐採自動化", icon:"⚙️🪓", kind:"harvest", place:"伐採マシンを森に設置" },
  autoTrade:   { name:"売買自動化", icon:"⚙️💰", kind:"trade",   place:"売買NPCをカウンターに常駐" }
};
function effModalKeys(){ return [...Object.keys(UPGRADE_DEFS), ...Object.keys(AUTOMATION_DEFS)]; }
function renderEffList(){
  const wrap = document.getElementById("effList");
  const keys = effModalKeys();
  let html = "";
  keys.forEach((key, idx)=>{
    const sel = (activeModal==="eff" && modalSelIndex===idx) ? " selected" : "";
    if(UPGRADE_DEFS[key]){
      const def = UPGRADE_DEFS[key];
      const lv = state.upgrades[key];
      const atCap = lv >= UPGRADE_MAX;
      const cost = atCap ? null : upgradeCost(lv);
      html += `<div class="eff-row${sel}">
        <div class="eff-info">
          <div class="name">${def.icon} ${def.name} Lv.${lv}</div>
          <div class="lv">${def.desc(lv)}</div>
        </div>
        ${atCap
          ? `<button class="btn btn-sub" disabled>MAX</button>`
          : `<button class="btn btn-sub" data-eff="${key}" ${state.resources.gold<cost?"disabled":""}>🪙${cost}</button>`}
      </div>`;
    } else {
      const def = AUTOMATION_DEFS[key];
      const a = state.automation[def.kind];
      const atCap = a.level >= AUTOMATION_MAX;
      const cost = atCap ? null : automationCost(def.kind);
      const box = def.kind==="harvest" ? state.automation.harvest.boxWood : state.automation.trade.boxGold;
      const boxIcon = def.kind==="harvest" ? "🪵" : "🪙";
      const boxName = def.kind==="harvest" ? "木材収集ボックス" : "G収集ボックス";
      let descLine;
      if(a.level===0){
        descLine = `${def.place}。生産物は拠点の${boxName}に格納される`;
      } else if(def.kind==="harvest"){
        descLine = `稼働中 ${a.level}台(1台あたり木1本を${AUTOMATION_HARVEST_SECONDS}秒で伐採)${atCap?"":` → 次Lv ${a.level+1}台`} ・ ${boxName}内 ${boxIcon}${Math.floor(box)}(拠点で回収)`;
      } else {
        descLine = `稼働中 ${a.level}体(1体あたり${AUTOMATION_SELL_RATE}個/秒・客NPCの列も1本ずつ増設)${atCap?"":` → 次Lv ${a.level+1}体`} ・ ${boxName}内 ${boxIcon}${Math.floor(box)}(拠点で回収)`;
      }
      const btnLabel = a.level===0 ? "導入" : `Lv.${a.level+1}へ`;
      html += `<div class="eff-row${sel}">
        <div class="eff-info">
          <div class="name">${def.icon} ${def.name}${a.level>0?` Lv.${a.level}`:""}</div>
          <div class="lv">${descLine}</div>
        </div>
        ${atCap
          ? `<button class="btn btn-sub" disabled>MAX</button>`
          : `<button class="btn btn-sub" data-auto="${def.kind}" ${state.resources.gold<cost?"disabled":""}>${btnLabel} 🪙${cost}</button>`}
      </div>`;
    }
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll("[data-eff]").forEach(btn=>{
    btn.addEventListener("click", ()=> buyUpgrade(btn.getAttribute("data-eff")));
  });
  wrap.querySelectorAll("[data-auto]").forEach(btn=>{
    btn.addEventListener("click", ()=> buyAutomation(btn.getAttribute("data-auto")));
  });
}
function buyUpgrade(key){
  const lv = state.upgrades[key];
  if(lv >= UPGRADE_MAX) return;
  const cost = upgradeCost(lv);
  if(state.resources.gold < cost){ toast("ゴールドが足りない"); return; }
  state.resources.gold -= cost;
  state.upgrades[key] += 1;
  renderResBar(); renderEffList(); save();
  toast(`🛠️ ${UPGRADE_DEFS[key].name}をLv.${state.upgrades[key]}に強化した!`);
}

// --- NPC雇用モーダル(伐採NPC・売買NPCをゴールドで雇用、それぞれ最大5体) -------
const WORKER_KIND_DEFS = {
  harvest: { name:"伐採NPC", icon:"🪓", desc:"森へ行かなくても木材を自動で確保してカウンターに納品する" },
  sell:    { name:"売買NPC", icon:"💰", desc:"売買ポイントでお客さんへの対応を代行する" }
};
function openNpcModal(){
  activeModal = "npc";
  modalSelIndex = 0;
  renderNpcHireList();
  document.getElementById("npcModal").hidden = false;
}
function closeNpcModal(){
  activeModal = null;
  document.getElementById("npcModal").hidden = true;
}
function renderNpcHireList(){
  const wrap = document.getElementById("npcHireList");
  const kinds = Object.keys(WORKER_KIND_DEFS);
  let html = "";
  kinds.forEach((kind, idx)=>{
    const def = WORKER_KIND_DEFS[kind];
    const arr = kind === "harvest" ? state.harvestWorkers : state.sellWorkers;
    const atMax = arr.length >= WORKER_MAX;
    const sel = (activeModal==="npc" && modalSelIndex===idx) ? " selected" : "";
    html += `<div class="eff-row${sel}">
      <div class="eff-info">
        <div class="name">${def.icon} ${def.name} (${arr.length}/${WORKER_MAX})</div>
        <div class="lv">${def.desc}</div>
      </div>
      ${atMax
        ? `<button class="btn btn-sub" disabled>満員</button>`
        : `<button class="btn btn-sub" data-hire="${kind}" ${state.resources.gold<HIRE_COST?"disabled":""}>🪙${HIRE_COST}</button>`}
    </div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll("[data-hire]").forEach(btn=>{
    btn.addEventListener("click", ()=> hireWorker(btn.getAttribute("data-hire")));
  });
}

function render(){
  renderResBar();
  renderMarket();
}

/* =========================================================
   トースト
   ========================================================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
}

/* =========================================================
   タブ切替
   ========================================================= */
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.getAttribute("data-view")).classList.add("active");
  });
});

/* =========================================================
   十字キー(押している間だけ3Dワールド内を移動し続ける)
   ========================================================= */
document.querySelectorAll(".dpad [data-dir]").forEach(btn=>{
  const dir = btn.getAttribute("data-dir");
  const start = (e)=>{ e.preventDefault(); heldDir = dir; btn.classList.add("pressed"); };
  const end = ()=>{ if(heldDir===dir) heldDir=null; btn.classList.remove("pressed"); };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", end);
  btn.addEventListener("pointercancel", end);
});

// PCの矢印キーでも移動できるようにする。モーダルを開いている間は、矢印キー/エンターキーは
// モーダル内の項目選択・実行に使われる(プレイヤーの移動には使われない)
const ARROW_KEY_DIR = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right" };
function modalItemKeys(){
  return activeModal === "eff" ? effModalKeys() : Object.keys(WORKER_KIND_DEFS);
}
function modalRerender(){
  if(activeModal === "eff") renderEffList();
  else if(activeModal === "npc") renderNpcHireList();
}
function modalConfirm(){
  const key = modalItemKeys()[modalSelIndex];
  if(activeModal === "eff"){
    if(UPGRADE_DEFS[key]) buyUpgrade(key);
    else if(AUTOMATION_DEFS[key]) buyAutomation(AUTOMATION_DEFS[key].kind);
  }
  else if(activeModal === "npc") hireWorker(key);
}
function modalClose(){
  if(activeModal === "eff") closeEfficiencyModal();
  else if(activeModal === "npc") closeNpcModal();
}
window.addEventListener("keydown", (e)=>{
  if(activeModal){
    if(e.key==="ArrowUp" || e.key==="ArrowLeft"){
      e.preventDefault();
      const n = modalItemKeys().length;
      modalSelIndex = (modalSelIndex - 1 + n) % n;
      modalRerender();
    } else if(e.key==="ArrowDown" || e.key==="ArrowRight"){
      e.preventDefault();
      const n = modalItemKeys().length;
      modalSelIndex = (modalSelIndex + 1) % n;
      modalRerender();
    } else if(e.key==="Enter"){
      e.preventDefault();
      modalConfirm();
    } else if(e.key==="Escape"){
      e.preventDefault();
      modalClose();
    }
    return;
  }
  const dir = ARROW_KEY_DIR[e.key];
  if(dir){
    e.preventDefault();
    heldDir = dir;
    const btn = document.querySelector(`.dpad [data-dir="${dir}"]`);
    if(btn) btn.classList.add("pressed");
    return;
  }
  if(e.key === "Enter"){
    e.preventDefault();
    const p = state.player;
    if(distTo(EFF_COUNTER_PT.x,EFF_COUNTER_PT.z,p.x,p.z) <= INTERACT_RADIUS) openEfficiencyModal();
    else if(distTo(NPC_COUNTER_PT.x,NPC_COUNTER_PT.z,p.x,p.z) <= INTERACT_RADIUS) openNpcModal();
  }
});
window.addEventListener("keyup", (e)=>{
  const dir = ARROW_KEY_DIR[e.key];
  if(!dir) return;
  if(heldDir === dir) heldDir = null;
  const btn = document.querySelector(`.dpad [data-dir="${dir}"]`);
  if(btn) btn.classList.remove("pressed");
});

/* =========================================================
   効率化モーダル
   ========================================================= */
document.getElementById("btnCloseEff").addEventListener("click", closeEfficiencyModal);

/* =========================================================
   NPC雇用モーダル
   ========================================================= */
document.getElementById("btnCloseNpc").addEventListener("click", closeNpcModal);

/* =========================================================
   設定モーダル
   ========================================================= */
document.getElementById("btnSettings").addEventListener("click", ()=>{
  document.getElementById("settingsModal").hidden = false;
});
document.getElementById("btnCloseSettings").addEventListener("click", ()=>{
  document.getElementById("settingsModal").hidden = true;
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  if(confirm("本当にすべてのデータをリセットしますか?この操作は元に戻せません。")){
    localStorage.removeItem(SAVE_KEY);
    state = defaultState();
    trees.forEach(t=>{ t.state="tree"; t.progress=0; t.stumpUntil=0; setTreeVisual(t); });
    harvestingTreeIdx = -1;
    stepping = false;
    if(world) npcQueues.forEach(q=> q.forEach(npc=> world.group.remove(npc.mesh)));
    npcQueues = Array.from({length: TRADE_LANE_MAX}, () => []);
    if(world) exitingNpcs.forEach(npc=> world.group.remove(npc.mesh));
    exitingNpcs = [];
    ensureQueueFilled(0);
    doorSwing = 0;
    if(world) setDoorSwing(world.door, 0);
    activeModal = null;
    document.getElementById("settingsModal").hidden = true;
    document.getElementById("effModal").hidden = true;
    document.getElementById("npcModal").hidden = true;
    render();
    updatePlayerMesh();
    updateWoodPile();
    syncWorkerMeshes();
    syncAutomationMeshes();
    save();
    toast("データをリセットしました");
  }
});
document.getElementById("verNum").textContent =
  document.querySelector('meta[name="app-version"]').content;

/* =========================================================
   起動
   ========================================================= */
state = load();
render();
initScene();
save();
setInterval(save, 5000); // 定期オートセーブ(移動中の座標なども取りこぼさないように)

// タブを再表示した時にも表示を最新化
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    render();
    save();
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

})();
